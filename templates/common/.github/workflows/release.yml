# Gated release (REL-4, REL-5) after CI succeeded on main. Logic lives in KavoshStart {{KAVOSHSTART}}.
# Release PRs are opened by GITHUB_TOKEN: approve their CI with "Approve and run" (see KavoshStart standard/03).
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  release:
    uses: bagdeli/KavoshStart/.github/workflows/kavosh-release.yml@{{KAVOSHSTART}}
    with:
      package: {{PACKAGE}}   # true for runtime none/desktop: `make package` → dist/* attached to the release
