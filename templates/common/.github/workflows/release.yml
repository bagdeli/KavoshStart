# Gated release (REL-4, REL-5). Private GitHub-hosted runs need a direct manual dispatch on exact main.
# PRIVATE_HOSTED_DISPATCH_REQUIRED: workflow_run is disabled for private hosted runner selections.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      authorization-confirmed:
        description: Confirm this one release-gate run on the selected main SHA
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && !{{PRIVATE_HOSTED}}) ||
      (github.event_name == 'workflow_dispatch' && inputs.authorization-confirmed && github.ref == 'refs/heads/main')
    uses: bagdeli/KavoshStart/.github/workflows/kavosh-release.yml@{{KAVOSHSTART}}
    with:
      runs-on: '{{RUNS_ON_JSON}}'
      package: {{PACKAGE}}
      required-workflow: '{{CI_WORKFLOW}}'
      kavosh-workflow: '.github/workflows/kavosh.yml'
