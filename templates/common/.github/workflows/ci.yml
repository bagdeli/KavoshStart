# CI — command contract. Draft CI is off by default; explicit ci:full / dispatch requests early feedback.
# PRIVATE_HOSTED_DISPATCH_REQUIRED: private GitHub-hosted runs require direct workflow_dispatch for one exact PR head.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open PR number (required for a private hosted run)
        required: false
        type: string
      expected-head:
        description: Exact current PR head SHA (required for a private hosted run)
        required: false
        type: string
      ci-full:
        description: Run the T2 heavy suite on this one authorized dispatch
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    if: >-
      (github.event_name == 'push' && !{{PRIVATE_HOSTED}}) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !{{PRIVATE_HOSTED}} &&
       (!github.event.pull_request.draft || (github.event.action == 'labeled' && github.event.label.name == 'ci:full')) &&
       (!{{SELF_HOSTED}} || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: {{RUNS_ON_YAML}}   # CI-1 (from kavosh.project.json)
    timeout-minutes: {{CI_TIMEOUT}}
    steps:
      - name: Verify scoped private hosted dispatch
        if: {{PRIVATE_HOSTED}} && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head }}
        run: |
          set -euo pipefail
          [ -n "$PR_NUMBER" ] && [ -n "$EXPECTED_HEAD" ]
          [ "$EXPECTED_HEAD" = "$GITHUB_SHA" ]
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/ci-pr.json"
          python3 - <<'PY'
          import json, os, sys
          pr = json.load(open(os.environ["RUNNER_TEMP"] + "/ci-pr.json", encoding="utf-8"))
          good = (pr.get("state") == "open" and pr.get("head", {}).get("sha") == os.environ["EXPECTED_HEAD"]
                  and pr.get("head", {}).get("sha") == os.environ["GITHUB_SHA"])
          if not good:
              sys.exit("private hosted authorization invalid: PR is closed or head SHA changed")
          print(f"one-run authorization: @{os.environ['GITHUB_ACTOR']} for PR #{pr['number']} @ {pr['head']['sha']}")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') != ''
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') == ''
        with:
          node-version: "lts/*"
      - name: Secret scan (gitleaks, SEC-1)
        if: ${{ '{{TIER}}' != 'T0' }}
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks dir . --redact --no-banner
      - run: make setup
      - run: make check
      - name: "Heavy suite (T2 only: main, tags, ci:full)"
        if: ${{ '{{TIER}}' == 'T2' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full') || (github.event_name == 'workflow_dispatch' && inputs.ci-full)) }}
        run: make check-full   # migrations rehearsal, e2e, contract tests
