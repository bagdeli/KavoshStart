# KavoshStart controls, pinned to the exact release declared in the manifest.
# PRIVATE_HOSTED_DISPATCH_REQUIRED: no automatic private hosted jobs may consume shared quota.
name: kavosh

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: One bounded manual run
        required: true
        default: health
        type: choice
        options: [health, pr-check, main-guard]
      pr-number:
        description: Open PR number (required for pr-check)
        required: false
        type: string
      expected-head:
        description: Exact current PR head SHA (required for pr-check)
        required: false
        type: string
      expected-sha:
        description: Exact current main SHA (required for main-guard)
        required: false
        type: string

concurrency:
  group: kavosh-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  kavosh:
    if: >-
      (github.event_name == 'pull_request' && !{{PRIVATE_HOSTED}} &&
       (!{{SELF_HOSTED}} || github.event.pull_request.head.repo.full_name == github.repository)) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'pr-check')
    uses: bagdeli/KavoshStart/.github/workflows/kavosh-governance.yml@{{KAVOSHSTART}}
    with:
      enforce: true
      runs-on: '{{RUNS_ON_JSON}}'
      authorization-pr: ${{ inputs.pr-number }}
      authorization-head: ${{ inputs.expected-head }}
  main-guard:
    if: >-
      (github.event_name == 'push' && !{{PRIVATE_HOSTED}}) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'main-guard')
    uses: bagdeli/KavoshStart/.github/workflows/kavosh-main-guard.yml@{{KAVOSHSTART}}
    with:
      runs-on: '{{RUNS_ON_JSON}}'
      authorization-sha: ${{ inputs.expected-sha }}
  health:
    if: >-
      (github.event_name == 'schedule' && !{{PRIVATE_HOSTED}}) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'health')
    uses: bagdeli/KavoshStart/.github/workflows/kavosh-health.yml@{{KAVOSHSTART}}
    with:
      runs-on: '{{RUNS_ON_JSON}}'
