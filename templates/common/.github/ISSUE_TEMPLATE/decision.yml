name: Decision
description: An architecture or product decision. Closed by a PR that adds an ADR.
title: "decision: "
labels: ["type:decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: drivers
    attributes:
      label: Decision drivers (what matters most)
  - type: markdown
    attributes:
      value: "Close this issue with the PR that adds `docs/decisions/NNNN-<slug>.md`."
