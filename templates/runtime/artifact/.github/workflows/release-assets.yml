# Builds release files when a Release is published and attaches them to it (runtime none/desktop).
name: release-assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest   # TODO(kavosh): windows-latest for Windows desktop builds (2× minutes)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version-file: ".node-version"
      - run: make setup
      - run: make package    # TODO(kavosh): must write files to ./dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
