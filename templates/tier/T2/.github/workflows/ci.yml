# CI — T2 profile. Fast checks on every ready PR; heavy suites only on main, tags or label ci:full (CI-5).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  required:
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    runs-on: {{RUNS_ON_YAML}}   # CI-1 (from kavosh.project.json)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') != ''
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') == ''
        with:
          node-version: "lts/*"   # add .node-version to pin the exact version
      - name: Secret scan (gitleaks, SEC-1)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks dir . --redact --no-banner
      - run: make setup
      - run: make check
      - name: Heavy suite (main, tags, ci:full)
        if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        run: make check-full   # TODO(kavosh): migrations rehearsal, e2e, contract tests
