# Independent AI review on ready PRs. Comments only — never approves or merges (PR-6).
# Setup once: run /install-github-app in Claude Code, or add ANTHROPIC_API_KEY as a repository secret.
# Costs Actions minutes (≈2–5 per review) + API usage: included in the T2 budget.
name: ai-review

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number || inputs.pr_number }} in ${{ github.repository }} against AGENTS.md,
            kavosh.project.json and the linked issue. Report only concrete problems: correctness bugs, security
            (authorization, secrets, injection), a new table/service/route/component that duplicates an existing owner,
            API/UI drift, missing tests, and scope beyond the issue's acceptance criteria.
            Post inline comments for each problem and one short summary. Never approve.
