# OPTIONAL team-only AI comments template: not scaffolded automatically, never required for T2.
# The owner must explicitly choose and install it after approving the exact API/Actions costs.
# An AI reviewer is not a second human and does not independently approve/merge releases.
name: ai-review

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Private hosted review is disabled (both manual and automatic); this optional
    # paid API integration must not silently consume private hosted minutes.
    if: >-
      !{{PRIVATE_HOSTED}} &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: {{RUNS_ON_YAML}}   # CI-1 (from kavosh.project.json)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number || inputs.pr_number }} in ${{ github.repository }} against AGENTS.md,
            kavosh.project.json and the linked issue. Report only concrete problems: correctness bugs, security
            (authorization, secrets, injection), a new table/service/route/component that duplicates an existing owner,
            API/UI drift, missing tests, and scope beyond the issue's acceptance criteria.
            Post inline comments for each problem and one short summary. Never approve.
