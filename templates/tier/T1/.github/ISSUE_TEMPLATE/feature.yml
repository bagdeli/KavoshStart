name: Feature
description: A deliverable slice (2–10 days). Split into task sub-issues; T2 needs a spec first.
title: "feat: "
labels: ["type:feature"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic (T2)
      placeholder: "#3"
  - type: textarea
    id: story
    attributes:
      label: Problem / user story
      placeholder: As a <role>, I want <capability> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Given … when … then …
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: input
    id: spec
    attributes:
      label: Spec folder
      placeholder: specs/<issue>-<slug>/ (first PR of this feature)
