name: Feature
description: A focused, independently useful change. Split or write a spec only for genuinely complex multi-team work; routine upstream maintenance needs no separate feature tree.
title: "feat: "
labels: ["type:feature"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic (optional team scope)
      placeholder: "#3"
  - type: textarea
    id: story
    attributes:
      label: Problem / user story
      placeholder: As a <role>, I want <capability> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Given … when … then …
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: input
    id: spec
    attributes:
      label: Spec folder (optional complex change)
      placeholder: specs/<issue>-<slug>/ (first PR of this feature)
