# GENERATED by tooling/build_workflows.py from tooling/src/governance.py — do not edit by hand.
# KavoshStart governance (layer P): manifest, repository files and pull-request rules in ONE job
# (every job costs at least one billable minute on the Free plan).
name: kavosh-governance

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels. Private repos pass their self-hosted labels (CI-1), e.g. '["self-hosted","linux","x64","kavoshsms"]'
        type: string
        default: '["ubuntu-latest"]'
      enforce:
        description: false = report only (adoption phase)
        type: boolean
        default: true
      comment:
        description: Post/update a sticky PR comment with the report
        type: boolean
        default: true
      authorization-pr:
        description: PR number for an owner-initiated private hosted dispatch
        type: string
        default: ""
      authorization-head:
        description: Exact PR head SHA approved for this one dispatch
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  governance:
    name: governance
    # Drafts: only checked when opened (plan stage). Pushes to drafts cost nothing.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.action == 'opened'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.authorization-head || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate private hosted dispatch scope
        if: github.event_name == 'workflow_dispatch' && inputs.authorization-pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.authorization-pr }}
          EXPECTED_HEAD: ${{ inputs.authorization-head }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_HEAD" ] && [ "$EXPECTED_HEAD" = "$GITHUB_SHA" ]
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/kavosh-pr.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          pr = json.load(open(os.environ["RUNNER_TEMP"] + "/kavosh-pr.json", encoding="utf-8"))
          if pr.get("state") != "open" or pr.get("head", {}).get("sha") != os.environ["EXPECTED_HEAD"]:
              sys.exit("authorization expired: PR is closed or its head changed")
          event = {"action": "opened", "number": pr["number"], "pull_request": pr,
                   "repository": pr["base"]["repo"]}
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kavosh-event.json"
          path.write_text(json.dumps(event), encoding="utf-8")
          print(f"one-run authorization: @{os.environ['GITHUB_ACTOR']} for PR #{pr['number']} @ {pr['head']['sha']}")
          PY
          echo "GITHUB_EVENT_PATH=$RUNNER_TEMP/kavosh-event.json" >> "$GITHUB_ENV"
      - name: Check KavoshStart rules
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENFORCE: ${{ inputs.enforce }}
          KAVOSH_REPORT: ${{ runner.temp }}/kavosh-report.md
        run: |
          python3 - <<'PY'
__PYTHON__
          PY
      - name: Sticky PR comment
        if: always() && inputs.comment && (github.event_name == 'pull_request' || inputs.authorization-pr != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.authorization-pr || github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/kavosh-report.md
        run: |
          [ -f "$REPORT" ] || exit 0
          marker='<!-- kavosh-governance -->'
          body="$marker"$'\n'"$(cat "$REPORT")"
          id=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          elif grep -q '\*\*FAIL\*\*' "$REPORT"; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
