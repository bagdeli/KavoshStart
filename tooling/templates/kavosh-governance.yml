# GENERATED by tooling/build_workflows.py from tooling/src/governance.py — do not edit by hand.
# KavoshStart governance (layer P): manifest, repository files and pull-request rules in ONE job
# (every job costs at least one billable minute on the Free plan).
name: kavosh-governance

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels. Private repos pass their self-hosted labels (CI-1), e.g. '["self-hosted","linux","x64","kavoshsms"]'
        type: string
        default: '["ubuntu-latest"]'
      enforce:
        description: Compatibility input only; false is fail-closed and never authorizes report-only success
        type: boolean
        default: true
      comment:
        description: Post/update a sticky PR comment with the report
        type: boolean
        default: true
      authorization-pr:
        description: PR number for an owner-initiated private hosted dispatch
        type: string
        default: ""
      authorization-head:
        description: Exact PR head SHA approved for this one dispatch
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  governance:
    name: governance
    # Drafts: only checked when opened (plan stage). Pushes to drafts cost nothing.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.action == 'opened'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.authorization-head || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate private hosted dispatch scope
        if: github.event_name == 'workflow_dispatch' && inputs.authorization-pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.authorization-pr }}
          EXPECTED_HEAD: ${{ inputs.authorization-head }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_HEAD" ] && [ "$EXPECTED_HEAD" = "$GITHUB_SHA" ]
          python3 - <<'PY'
          import json, os, pathlib, sys, urllib.error, urllib.request

          def api(path):
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              token = os.environ["GH_TOKEN"]
              req = urllib.request.Request(
                  f"{base}/{path.lstrip('/')}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API failed: HTTP {exc.code} {detail}") from exc

          pr = api(f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}")
          if pr.get("state") != "open" or pr.get("head", {}).get("sha") != os.environ["EXPECTED_HEAD"]:
              sys.exit("authorization expired: PR is closed or its head changed")
          event = {"action": "opened", "number": pr["number"], "pull_request": pr,
                   "repository": pr["base"]["repo"]}
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kavosh-event.json"
          path.write_text(json.dumps(event), encoding="utf-8")
          print(f"one-run authorization: @{os.environ['GITHUB_ACTOR']} for PR #{pr['number']} @ {pr['head']['sha']}")
          PY
          echo "GITHUB_EVENT_PATH=$RUNNER_TEMP/kavosh-event.json" >> "$GITHUB_ENV"
      - name: Check KavoshStart rules
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENFORCE: ${{ inputs.enforce }}
          KAVOSH_REPORT: ${{ runner.temp }}/kavosh-report.md
        run: |
          python3 - <<'PY'
__PYTHON__
          PY
      - name: Sticky PR comment
        if: always() && inputs.comment && (github.event_name == 'pull_request' || inputs.authorization-pr != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.authorization-pr || github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/kavosh-report.md
        run: |
          [ -f "$REPORT" ] || exit 0
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          marker = "<!-- kavosh-governance -->"
          report = pathlib.Path(os.environ["REPORT"]).read_text(encoding="utf-8")
          body = marker + "\n" + report

          def api(path, method="GET", payload=None):
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              token = os.environ["GH_TOKEN"]
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(
                  f"{base}/{path.lstrip('/')}", data=data, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API failed: HTTP {exc.code} {detail}") from exc
              return json.loads(raw) if raw.strip() else None

          comments = api(f"repos/{os.environ['REPO']}/issues/{os.environ['PR']}/comments?per_page=100") or []
          existing = next((item for item in comments if (item.get("body") or "").startswith(marker)), None)
          if existing:
              api(f"repos/{os.environ['REPO']}/issues/comments/{existing['id']}", method="PATCH", payload={"body": body})
          elif "**FAIL**" in report:
              api(f"repos/{os.environ['REPO']}/issues/{os.environ['PR']}/comments", method="POST", payload={"body": body})
          PY
