# GENERATED by tooling/build_workflows.py from tooling/src/main_guard.py — do not edit by hand.
# KavoshStart main guard (layer M): records direct pushes, force-pushes and merges whose required checks were
# missing or not green. Fails (red) when it records a violation, which also closes the REL-5 release gate.
name: kavosh-main-guard

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON GitHub-hosted runner labels. Private repos are hosted-only; e.g. '["ubuntu-latest"]'. Public exceptions require CI-2 ADR.
        type: string
        default: '["ubuntu-latest"]'
      required-checks:
        description: Check names that must exist and succeed on the head of every merged PR
        type: string
        default: "kavosh / governance,required"
      authorization-sha:
        description: Exact current main SHA for an owner-initiated manual audit
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: read

jobs:
  main-guard:
    name: main-guard
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Inspect push to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED: ${{ inputs.required-checks }}
          AUTHORIZED_SHA: ${{ inputs.authorization-sha }}
        run: |
          python3 - <<'PY'
__PYTHON__
          PY
