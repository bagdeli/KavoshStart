# Layer O — PUBLIC portfolio supervisor. Thin wrapper around scripts/portfolio_guard.py.
# It inspects and reports public repositories only; private repositories are ignored before inspection/reporting.
# Uses the repository-scoped GITHUB_TOKEN; no PAT or shared account secret is required.
name: kavosh-portfolio

on:
  schedule:
    - cron: "0 4 * * *"   # daily 07:30 Tehran; standard hosted jobs on public repos are free
  workflow_dispatch:

concurrency:
  group: kavosh-portfolio
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect public portfolio and maintain canonical issue
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/portfolio_guard.py "${{ github.repository_owner }}" --update-issue > report.md
          echo "findings=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when there are findings
        if: steps.inspect.outputs.findings != '0'
        run: exit 1
