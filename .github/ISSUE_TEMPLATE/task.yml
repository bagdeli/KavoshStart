name: Task
description: One PR-sized unit of work (≤ 1 day, within the PR size limit). The default unit for AI agents.
title: "task: "
labels: ["type:task"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent (feature / epic)
      description: Also attach this issue as a sub-issue of the parent.
      placeholder: "#12"
  - type: textarea
    id: goal
    attributes:
      label: Goal (one sentence)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checklist. The agent implements exactly these.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Where to look
      description: Files, modules, existing owners, ADRs. Saves the agent a broad search.
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: dropdown
    id: agent
    attributes:
      label: Suitable for an AI agent?
      options:
        - "Yes — fully specified"
        - "Yes — with human pairing"
        - "No — needs human judgement"
    validations:
      required: true
