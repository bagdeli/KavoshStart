# KavoshStart governs itself with its own reusable workflows (local path = always the current version).
name: kavosh

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 6"
  workflow_dispatch:

concurrency:
  group: kavosh-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  kavosh:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/kavosh-governance.yml
  main-guard:
    if: github.event_name == 'push'
    uses: ./.github/workflows/kavosh-main-guard.yml
  health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/kavosh-health.yml
