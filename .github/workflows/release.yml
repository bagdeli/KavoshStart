# KavoshStart releases itself through its own gated release workflow (REL-4, REL-5).
# Runs only after self-check succeeded for a push to main. No floating major tag: consumers pin exact versions.
name: release

on:
  workflow_run:
    workflows: [self-check]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  release:
    uses: ./.github/workflows/kavosh-release.yml
