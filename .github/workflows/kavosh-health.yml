# GENERATED by tooling/build_workflows.py from tooling/src/health.py — do not edit by hand.
# KavoshStart weekly health (layer H): keeps ONE issue labelled kavosh:health up to date.
name: kavosh-health

on:
  workflow_call:
    inputs:
      update-issue:
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  health:
    name: health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute repository health
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPDATE_ISSUE: ${{ inputs.update-issue }}
        run: |
          python3 - <<'PY'
          # KavoshStart weekly health report (layer H). Embedded into .github/workflows/kavosh-health.yml.
          # Also runnable locally: REPO=owner/repo UPDATE_ISSUE=false python3 tooling/src/health.py
          import base64
          import json
          import math
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone

          NOW = datetime.now(timezone.utc)


          def gh(path, check=True):
              r = subprocess.run(["gh", "api", path], capture_output=True, text=True, encoding="utf-8")
              if r.returncode != 0:
                  if check:
                      raise RuntimeError(f"{path}: {r.stderr.strip()}")
                  return None
              return json.loads(r.stdout) if r.stdout.strip() else None


          def paged(path, key=None, max_pages=10):
              items, sep = [], "&" if "?" in path else "?"
              for page in range(1, max_pages + 1):
                  data = gh(f"{path}{sep}per_page=100&page={page}")
                  batch = data.get(key, []) if key else data
                  items += batch
                  if len(batch) < 100:
                      break
              return items


          def ts(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))


          def days(s):
              return (NOW - ts(s)).days


          AUTOMATION_LABELS = {"kavosh:health", "kavosh:violation", "kavosh:portfolio"}


          def type_label_problems(issues):
              """WK-1: exactly one type:* label; issues maintained by KavoshStart automation are exempt."""
              out = []
              for i in issues:
                  names = {l["name"] for l in i.get("labels", [])}
                  if names & AUTOMATION_LABELS:
                      continue
                  n = sum(1 for x in names if x.startswith("type:"))
                  if n != 1:
                      out.append(f"#{i['number']} ({n} type labels)")
              return out


          def direct_pushes(commits, pulls_for):
              """BR-6: commits on the default branch that no merged PR produced (the initial scaffold root is allowed)."""
              out = []
              for c in commits:
                  msg = (c.get("commit", {}).get("message") or "").splitlines()[0] if c.get("commit") else ""
                  if msg.startswith("chore: scaffold from KavoshStart") and not c.get("parents"):
                      continue
                  if not any(p.get("merged_at") for p in pulls_for(c["sha"])):
                      out.append(c["sha"][:7])
              return out


          def trailer_ratio(commits):
              """AI-3 (informational): how many default-branch commits carry a Co-Authored-By trailer."""
              total = len(commits)
              with_trailer = sum(1 for c in commits if "co-authored-by:" in (c.get("commit", {}).get("message") or "").lower())
              return with_trailer, total


          def monthly_minutes(repo, exact_limit=120):
              """Billable hosted minutes this month. Exact (per job, rounded up) for up to `exact_limit` runs;
              beyond that, the exact per-run average of the sampled runs is extrapolated — marked with "~"."""
              start = NOW.strftime("%Y-%m-01")
              runs = [r for r in paged(f"repos/{repo}/actions/runs?created=%3E%3D{start}", key="workflow_runs", max_pages=20)
                      if r.get("status") == "completed" and r.get("conclusion") != "skipped"]
              total, sampled = 0, runs[:exact_limit]
              for run in sampled:
                  for job in (gh(f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100", check=False) or {}).get("jobs", []):
                      if "self-hosted" in (job.get("labels") or []) or not job.get("started_at") or not job.get("completed_at"):
                          continue
                      secs = (ts(job["completed_at"]) - ts(job["started_at"])).total_seconds()
                      if secs > 0:
                          total += math.ceil(secs / 60)
              if len(runs) > len(sampled) and sampled:
                  return f"~{round(total / len(sampled) * len(runs))}", len(runs)
              return total, len(runs)


          def main():
              repo = os.environ["REPO"]
              rows = []

              def add(ok, rule, metric, value, target):
                  rows.append(("✅" if ok is True else "⚠️" if ok == "warn" else "❌", rule, metric, value, target))

              info = gh(f"repos/{repo}")
              default = info["default_branch"]
              manifest = {}
              raw = gh(f"repos/{repo}/contents/kavosh.project.json", check=False)
              if raw and raw.get("content"):
                  manifest = json.loads(base64.b64decode(raw["content"]).decode("utf-8"))
              limits = manifest.get("limits", {})
              budget = manifest.get("ci", {}).get("monthlyMinutesBudget")
              add(bool(manifest), "SRC-5", "Manifest present", manifest.get("tier", "missing"), "kavosh.project.json")

              # Branches
              branches = [b["name"] for b in paged(f"repos/{repo}/branches") if b["name"] != default]
              stale, ahead = [], []
              max_age = int(limits.get("branchMaxAgeDays", 3))
              old = []
              for name in branches[:40]:  # a healthy repo has ≤ 10; beyond 40 the count alone is the finding
                  cmp = gh(f"repos/{repo}/compare/{default}...{name}", check=False)
                  if not cmp:
                      continue
                  last = cmp["commits"][-1]["commit"]["committer"]["date"] if cmp.get("commits") else None
                  if last and days(last) > 7:
                      stale.append(name)
                  elif last and days(last) > max_age:
                      old.append(name)
                  if cmp.get("ahead_by", 0) > 50:
                      ahead.append(f"{name} (+{cmp['ahead_by']})")
              add(len(branches) <= 10, "BR-1", "Branches other than main", len(branches), "≤ 10")
              add(not stale, "BR-3", "Branches idle > 7 days", ", ".join(stale[:8]) or 0, "0")
              add("warn" if old else True, "BR-3", f"Branches older than {max_age} days", ", ".join(old[:8]) or 0, "0")
              add(not ahead, "BR-8", f"Branches > 50 commits ahead of {default}", ", ".join(ahead[:5]) or 0, "0")

              # Pull requests
              prs = paged(f"repos/{repo}/pulls?state=open")
              ready = [p for p in prs if not p["draft"] and p["user"]["type"] != "Bot"]
              max_ready = int(limits.get("maxOpenReadyPRs", 3))
              drafts = [f"#{p['number']}" for p in prs if p["draft"] and days(p["updated_at"]) > 7]
              off = [f"#{p['number']}→{p['base']['ref']}" for p in prs if p["base"]["ref"] != default]
              add(len(ready) <= max_ready, "PR-8", "Open ready PRs", len(ready), f"≤ {max_ready}")
              add(not drafts, "PR-9", "Drafts idle > 7 days", ", ".join(drafts) or 0, "0")
              add(len(off) <= 1, "BR-4", f"Open PRs not targeting {default}", ", ".join(off) or 0, "≤ 1")

              # Issues
              issues = [i for i in paged(f"repos/{repo}/issues?state=open") if "pull_request" not in i]
              mistyped = type_label_problems(issues)
              noisy = [f"#{i['number']} ({i['comments']})" for i in issues if i["comments"] > 30]
              viol = [f"#{i['number']}" for i in issues if any(l["name"] == "kavosh:violation" for l in i["labels"])]
              add(not mistyped, "WK-1", "Open issues with exactly one type:* label", ", ".join(mistyped[:12]) or "all", "all")
              add(not noisy, "WK-2", "Issues with > 30 comments", ", ".join(noisy) or 0, "0")
              add(not viol, "PR-7", "Open violation issues", ", ".join(viol) or 0, "0")

              # CI, last 7 days
              since = (NOW - timedelta(days=7)).strftime("%Y-%m-%d")
              runs = [r for r in paged(f"repos/{repo}/actions/runs?created=%3E%3D{since}", key="workflow_runs", max_pages=5)
                      if r["status"] == "completed" and r["conclusion"] != "skipped"]
              canc = sum(r["conclusion"] == "cancelled" for r in runs)
              main_runs = [r for r in runs if r["head_branch"] == default and r["event"] == "push"]
              rate = round(100 * canc / len(runs)) if runs else 0
              add(rate < 10, "CI-4", "CI cancelled rate (7 d)", f"{rate}% of {len(runs)}", "< 10%")
              if main_runs:
                  ok_rate = round(100 * sum(r["conclusion"] == "success" for r in main_runs) / len(main_runs))
                  add(ok_rate > 90, "CI-8", f"CI success on {default} (7 d)", f"{ok_rate}% of {len(main_runs)}", "> 90%")

              # Direct pushes and agent attribution on the default branch (BR-6, AI-3)
              commits = gh(f"repos/{repo}/commits?sha={default}&since={since}T00:00:00Z&per_page=100") or []
              direct = direct_pushes(commits, lambda sha: gh(f"repos/{repo}/commits/{sha}/pulls", check=False) or [])
              add(not direct, "BR-6", f"Direct pushes to {default} (7 d)", ", ".join(direct[:10]) or 0, "0")
              month = gh(f"repos/{repo}/commits?sha={default}&since={(NOW - timedelta(days=30)).strftime('%Y-%m-%d')}T00:00:00Z&per_page=100") or []
              attributed, total = trailer_ratio(month)
              add(True, "AI-3", f"Commits on {default} with Co-Authored-By (30 d)", f"{attributed} of {total}",
                  "informational: every agent-written change must carry one")

              # Minutes
              used, nruns = monthly_minutes(repo)
              used_n = int(str(used).lstrip("~"))
              if budget is not None:
                  pct = round(100 * used_n / budget) if budget else 100
                  add(True if pct < 80 else "warn" if pct <= 100 else False, "CI-3", "Minutes this month (estimate)",
                      f"{used} of {budget} ({pct}%, {nruns} runs)", "≤ budget")
              else:
                  add("warn", "CI-3", "Minutes this month (estimate)", f"{used} ({nruns} runs), no budget in manifest", "set ci.monthlyMinutesBudget")

              # Releases and tags
              rel = gh(f"repos/{repo}/releases?per_page=1") or []
              tags = [t["name"] for t in paged(f"repos/{repo}/tags")]
              bad_tags = [t for t in tags if not t.startswith("v")]
              tier = manifest.get("tier", "T1")
              if rel:
                  age = days(rel[0]["published_at"] or rel[0]["created_at"])
                  add(True if tier == "T0" or age <= 30 else "warn", "REL-1", "Latest release", f"{rel[0]['tag_name']} ({age} d ago)", "≤ 30 d (T1/T2)")
              else:
                  add("warn", "REL-1", "Latest release", "none", "exists")
              add(not bad_tags, "REL-3", "Non-version tags", ", ".join(bad_tags) or 0, "0")

              fails = sum(r[0] == "❌" for r in rows)
              body = [f"# Repository health — {NOW:%Y-%m-%d}", "",
                      f"Generated weekly by KavoshStart `kavosh-health`. **{fails} failing.** Every ❌ should become a task.", "",
                      "| | Rule | Metric | Value | Target |", "|---|---|---|---|---|"]
              body += [f"| {s} | {r} | {m} | {v} | {t} |" for s, r, m, v, t in rows]
              text = "\n".join(body) + "\n"
              print(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              if os.environ.get("UPDATE_ISSUE", "true") == "true":
                  def run(*a):
                      return subprocess.run(["gh", *a], capture_output=True, text=True, encoding="utf-8")
                  run("label", "create", "kavosh:health", "-R", repo, "--color", "0E8A16", "--description", "KavoshStart weekly repository health", "--force")
                  found = json.loads(run("issue", "list", "-R", repo, "--label", "kavosh:health", "--state", "open", "--json", "number").stdout or "[]")
                  if found:
                      run("issue", "edit", str(found[0]["number"]), "-R", repo, "--body", text)
                  else:
                      run("issue", "create", "-R", repo, "--title", "Repository health (KavoshStart)", "--label", "kavosh:health", "--body", text)


          if __name__ == "__main__":
              main()
          PY
