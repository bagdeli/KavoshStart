# CI of KavoshStart itself: generated workflows up to date, JSON/shell valid, every template passes governance.
name: self-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open release PR number for trusted release verification
        required: false
        type: string
      expected-head:
        description: Exact release PR head SHA
        required: false
        type: string
      ci-full:
        description: Compatibility input with the common CI dispatch contract
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

concurrency:
  group: self-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  required:
    name: required
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --quiet pyyaml && make check
      - run: python3 -c "import json,pathlib,yaml; roots=[pathlib.Path('.github'),pathlib.Path('intake'),pathlib.Path('rulesets')]; ys=[p for r in roots for p in r.rglob('*') if p.is_file() and p.suffix in ('.yml','.yaml')]; js=[p for r in roots for p in r.rglob('*.json') if p.is_file()]+[p for p in pathlib.Path('.').glob('*.json') if p.is_file()]; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in ys]; [json.loads(p.read_text(encoding='utf-8')) for p in js]"
      - name: Exercise the pinned Node setup action
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare isolated cross-domain fixture dependencies
        env:
          KAVOSH_CONFORMANCE_DEPS: ${{ runner.temp }}/conformance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pip install --quiet -r tooling/conformance-requirements.txt
          bash tooling/prepare_conformance.sh
      - name: Exercise real capability boundaries and seeded regressions
        env:
          KAVOSH_TERRAFORM: ${{ runner.temp }}/conformance-${{ github.run_id }}-${{ github.run_attempt }}/terraform
          KAVOSH_WORDPRESS_ROOT: ${{ runner.temp }}/conformance-${{ github.run_id }}-${{ github.run_attempt }}/wordpress
          KAVOSH_CONFORMANCE_REPORT: ${{ runner.temp }}/cross-domain.xml
        run: make conformance
      - name: Retain actual conformance result
        id: conformance-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-domain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cross-domain.xml
          retention-days: 7
          if-no-files-found: error
      - name: Verify live artifact transport and tamper rejection
        env:
          GH_TOKEN: ${{ github.token }}
          KAVOSH_ARTIFACT_ID: ${{ steps.conformance-artifact.outputs.artifact-id }}
        run: python3 tooling/receipt_transport_smoke.py
      - name: Capture exact verified public source
        if: github.repository == 'bagdeli/KavoshStart' && github.event.repository.private == false
        run: |
          mkdir -p "$RUNNER_TEMP/kavosh-verification"
          git archive --format=tar HEAD > "$RUNNER_TEMP/kavosh-verification/source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/kavosh-verification/source-identity.txt"
          sha256sum "$RUNNER_TEMP/kavosh-verification/source.tar" > "$RUNNER_TEMP/kavosh-verification/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.repository == 'bagdeli/KavoshStart' && github.event.repository.private == false
        with:
          name: kavosh-verified-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kavosh-verification/
          retention-days: 7
          if-no-files-found: error
