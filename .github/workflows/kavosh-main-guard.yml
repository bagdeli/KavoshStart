# GENERATED by tooling/build_workflows.py from tooling/src/main_guard.py — do not edit by hand.
# KavoshStart main guard (layer M): records direct pushes, force-pushes and merges whose required checks were
# missing or not green. Fails (red) when it records a violation, which also closes the REL-5 release gate.
name: kavosh-main-guard

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON labels for selected runner; private self-hosted needs CI-2 trust ADR, private GitHub-hosted needs one-run owner approval.
        type: string
        default: '["ubuntu-latest"]'
      required-checks:
        description: Check names that must exist and succeed on the head of every merged PR
        type: string
        default: "kavosh / governance,required"
      authorization-sha:
        description: Exact current main SHA for an owner-initiated manual audit
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: read

jobs:
  main-guard:
    name: main-guard
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - name: Inspect push to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED: ${{ inputs.required-checks }}
          AUTHORIZED_SHA: ${{ inputs.authorization-sha }}
        run: |
          python3 - <<'PY'
          # KavoshStart main guard (layer M). Embedded into .github/workflows/kavosh-main-guard.yml.
          # Runs on every push to the default branch. It never rewrites history; it records violations in ONE
          # open issue labelled `kavosh:violation` so nothing is silently lost (BR-6, BR-7, PR-7).
          # A merged PR must have every required check PRESENT and SUCCESSFUL on its head commit:
          # missing, pending, failed, cancelled or skipped are all violations.
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          SCAFFOLD_PREFIX = "chore: scaffold from KavoshStart"
          DEFAULT_REQUIRED = ["kavosh / governance", "required"]
          MAX_COMMITS = 20  # GitHub push payloads list at most 20 commits


          def gh_api(path, method="GET", payload=None, allow_status=()):
              """GitHub REST via Python stdlib; no GitHub CLI dependency on consumer runners."""
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise RuntimeError("GitHub API token is unavailable")
              url = path if path.startswith("https://") else f"{base}/{path.lstrip('/')}"
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  url, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  if exc.code in set(allow_status):
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {exc.code} {detail}") from exc
              return json.loads(raw) if raw.strip() else None


          def check_state(runs, required):
              """Newest run per name wins. Returns a list of problems for the required checks."""
              latest = {}
              pending_runs = {}
              for r in runs:
                  name = r.get("name", "")
                  if r.get("status") != "completed":
                      pending_runs[name] = r
                  stamp = r.get("started_at") or r.get("created_at") or ""
                  previous = latest.get(name, {})
                  previous_stamp = previous.get("started_at") or previous.get("created_at") or ""
                  pending = r.get("status") != "completed"
                  previous_pending = previous.get("status") != "completed"
                  if (name not in latest or stamp > previous_stamp or
                          (pending and not previous_pending and (not stamp or stamp == previous_stamp))):
                      latest[name] = r
              # An ambiguous in-flight rerun must never inherit an older green result. Once a
              # run completes, conclusion and run timestamps determine which result is newest.
              latest.update(pending_runs)
              problems = []
              for name in required:
                  r = latest.get(name)
                  if r is None:
                      problems.append(f"'{name}' missing")
                  elif r.get("status") != "completed":
                      problems.append(f"'{name}' {r.get('status')}")
                  elif r.get("conclusion") != "success":
                      problems.append(f"'{name}' {r.get('conclusion')}")
              return problems


          def _utc_timestamp(value):
              """Parse API timestamps; absent/naive/malformed timestamps are not evidence."""
              if not isinstance(value, str) or not value:
                  return None
              try:
                  stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  return stamp.astimezone(timezone.utc) if stamp.tzinfo else None
              except ValueError:
                  return None


          def check_state_at_merge(runs, required, merged_at):
              """Audit the historical boundary, never the current colour of the PR head.

              A later rerun cannot erase history. A result completed after the merge cannot
              authorize it. Unknown origin/completion times stay unverified, not green.
              """
              cutoff = _utc_timestamp(merged_at)
              if cutoff is None:
                  return ["merge timestamp unavailable; cannot verify PR-7 history"]
              latest, pending, unknown = {}, {}, {}

              def source_identity(run):
                  # Only independently identified Actions checks may supersede malformed
                  # historical evidence. Missing identity never becomes a wildcard.
                  app = run.get("app") or {}
                  app_id, head = app.get("id"), run.get("head_sha")
                  workflow_id = run.get("_history_workflow_id")
                  match = re.fullmatch(
                      r"https://github[.]com/([^/]+/[^/]+)/actions/runs/[0-9]+/job/[0-9]+",
                      run.get("html_url") or "", re.I,
                  )
                  if (type(app_id) is not int or app_id < 1 or app.get("slug") != "github-actions"
                          or not isinstance(head, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", head)
                          or match is None or type(workflow_id) is not int or workflow_id < 1):
                      return None
                  return app_id, app["slug"], head.lower(), match.group(1).lower(), workflow_id
              for run in runs:
                  name = run.get("name", "")
                  if name not in required:
                      continue
                  origin = _utc_timestamp(run.get("created_at"))
                  known_origin = origin
                  start = _utc_timestamp(run.get("started_at"))
                  end = _utc_timestamp(run.get("completed_at"))
                  if origin is not None and origin > cutoff:
                      continue  # proven later execution, not a retroactive merge violation
                  if origin is None and (start is None or start > cutoff):
                      state = run.get("status") or "unknown"
                      unknown.setdefault(name, []).append((None, run,
                          f"'{name}' {state} (merge-time origin unavailable)"))
                      continue
                  origin = origin or start
                  if (start is not None and start < origin) or (end is not None and end < (start or origin)):
                      unknown.setdefault(name, []).append((known_origin, run,
                          f"'{name}' has inconsistent evidence timestamps"))
                      continue
                  if run.get("status") == "completed" and end is None:
                      unknown.setdefault(name, []).append((known_origin, run,
                          f"'{name}' completion time unavailable at merge"))
                      continue
                  if run.get("status") != "completed" or end > cutoff:
                      pending[name] = f"'{name}' pending at merge"
                      continue
                  # Creation orders attempts, not completion (an older slow job may finish last).
                  key = (origin, start or origin, run.get("id") or 0)
                  if name not in latest or key > latest[name][0]:
                      latest[name] = (key, run)
              problems = []
              for name in required:
                  effective = latest.get(name)
                  unresolved = []
                  for origin, run, problem in unknown.get(name, []):
                      identity = source_identity(run)
                      if (origin is not None and effective is not None
                              and _utc_timestamp(effective[1].get("created_at")) is not None
                              and effective[0][0] > origin and identity is not None
                              and source_identity(effective[1]) == identity):
                          continue  # strictly newer, valid, same-source evidence supersedes this attempt
                      unresolved.append(problem)
                  if unresolved:
                      problems.append(sorted(unresolved)[0])
                  elif name in pending:
                      problems.append(pending[name])
                  elif name not in latest:
                      problems.append(f"'{name}' missing at merge")
                  elif latest[name][1].get("conclusion") != "success":
                      problems.append(f"'{name}' {latest[name][1].get('conclusion')} at merge")
              return problems


          def historical_check_runs(repo, head, required, api):
              """Read all attempts; Actions metadata supplies queue creation times.

              Check-run started_at alone cannot distinguish a pre-merge queued execution
              from one requested after the merge. Match the job/run/head before enriching.
              All access is read-only; unavailable metadata fails closed.
              """
              runs, page, attempts = [], 1, {}
              while True:
                  data = api(f"repos/{repo}/commits/{head}/check-runs?filter=all&per_page=100&page={page}") or {}
                  batch = data.get("check_runs", [])
                  for original in batch:
                      if original.get("name") not in required:
                          continue
                      run = dict(original)
                      match = re.fullmatch(
                          rf"https://github[.]com/{re.escape(repo)}/actions/runs/([0-9]+)/job/([0-9]+)",
                          run.get("html_url") or "",
                          re.I,
                      )
                      if match and (run.get("app") or {}).get("slug") == "github-actions":
                          run_id, job_id = match.groups()
                          job = api(f"repos/{repo}/actions/jobs/{job_id}") or {}
                          if (str(job.get("id")) != job_id or str(job.get("run_id")) != run_id
                                  or job.get("head_sha") != head or job.get("name") != run.get("name")):
                              raise RuntimeError("check/job identity mismatch while reading merge history")
                          attempt = job.get("run_attempt")
                          if not isinstance(attempt, int) or isinstance(attempt, bool) or attempt < 1:
                              raise RuntimeError("Actions job attempt unavailable; cannot establish merge history")
                          key = (run_id, attempt)
                          if key not in attempts:
                              attempts[key] = api(f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}") or {}
                          execution = attempts[key]
                          if (str(execution.get("id")) != run_id or execution.get("head_sha") != head
                                  or execution.get("run_attempt") != attempt):
                              raise RuntimeError("workflow attempt identity mismatch while reading merge history")
                          # A first execution can queue before any dependent job is created.
                          # Later attempts must not inherit the original run's creation time.
                          origin = execution.get("created_at") if attempt == 1 else execution.get("run_started_at")
                          origin_time, job_time = _utc_timestamp(origin), _utc_timestamp(job.get("created_at"))
                          if origin_time is None or job_time is None:
                              raise RuntimeError("Actions queue timestamp unavailable; cannot establish merge history")
                          run["created_at"] = min(origin_time, job_time).isoformat()
                          # Same-name checks from another workflow cannot supersede evidence.
                          workflow_id = execution.get("workflow_id")
                          if type(workflow_id) is int and workflow_id > 0:
                              run["_history_workflow_id"] = workflow_id
                      runs.append(run)
                  if len(batch) < 100:
                      return runs
                  page += 1


          def manual_dispatch_event(repo, expected_sha, actor, api):
              """Build a bounded main-push audit only if the owner dispatched against the current main SHA."""
              if not expected_sha:
                  raise RuntimeError("manual main-guard dispatch needs an exact authorized SHA")
              branch = api(f"repos/{repo}/branches/main") or {}
              current = (branch.get("commit") or {}).get("sha", "")
              if current != expected_sha:
                  raise RuntimeError(f"authorization expired: main is {current or '<unavailable>'}, expected {expected_sha}")
              commit = api(f"repos/{repo}/commits/{expected_sha}") or {}
              message = (commit.get("commit") or {}).get("message", "")
              parents = commit.get("parents") or []
              return {"ref": "refs/heads/main", "before": (parents[0] if parents else {}).get("sha", "0" * 40),
                      "after": expected_sha, "forced": False, "pusher": {"name": actor or "?"},
                      "commits": [{"id": expected_sha, "message": message}]}


          PR_SUFFIX_RE = re.compile(r"\(#([0-9]+)\)$")


          def merged_pr_for_commit(repo, sha, message, api):
              """Resolve the exact merged PR without trusting eventually-consistent commit association alone."""
              pulls = api(f"repos/{repo}/commits/{sha}/pulls") or []
              merged = [p for p in pulls if p.get("merged_at") and p.get("merge_commit_sha") == sha
                        and p.get("base", {}).get("ref") in ("main", "master")]
              if merged:
                  return merged[0]

              # GitHub's squash commit title normally carries "(#<pr>)". Immediately after merge the
              # commit→pull association endpoint can lag, while the pull itself is already authoritative.
              # This fallback stays fail-closed: the fetched PR must be merged, target main/master, and
              # report this exact commit as its merge_commit_sha.
              suffix = PR_SUFFIX_RE.search(message or "")
              if suffix:
                  candidate = api(f"repos/{repo}/pulls/{suffix.group(1)}") or {}
                  if (candidate.get("merged_at") and candidate.get("merge_commit_sha") == sha
                          and candidate.get("base", {}).get("ref") in ("main", "master")):
                      return candidate
              return None


          def inspect(event, repo, required, api):
              violations = []
              required = list(dict.fromkeys(required or []))
              if not set(DEFAULT_REQUIRED).issubset(required):
                  violations.append(f"**PR-7 configuration error** required checks must include {', '.join(DEFAULT_REQUIRED)}")
              if event.get("forced"):
                  violations.append(f"**BR-7 force-push** to `{event.get('ref')}` by @{(event.get('pusher') or {}).get('name', '?')} "
                                    f"(`{(event.get('before') or '')[:7]}` → `{(event.get('after') or '')[:7]}`)")
              commits = event.get("commits") or []
              if len(commits) > 1:
                  violations.append(f"**BR-6** one push added {len(commits)}{'+' if len(commits) >= MAX_COMMITS else ''} commits to main "
                                    f"— a squash merge always adds exactly one")
              for c in commits[:MAX_COMMITS]:
                  sha, msg = c["id"], (c.get("message") or "").splitlines()[0]
                  pr = merged_pr_for_commit(repo, sha, msg, api)
                  if not pr:
                      if msg.startswith(SCAFFOLD_PREFIX) and not (api(f"repos/{repo}/commits/{sha}") or {}).get("parents"):
                          continue  # the initial scaffold of an empty repository is the single allowed direct commit
                      violations.append(f"**BR-6 direct push** `{sha[:7]}` “{msg}” — no merged pull request")
                      continue
                  runs = historical_check_runs(repo, pr['head']['sha'], required, api)
                  problems = check_state_at_merge(runs, required, pr.get("merged_at"))
                  if problems:
                      violations.append(f"**PR-7 merged without green required checks** #{pr['number']} “{pr['title']}” — {', '.join(problems)}")
              return violations


          def record(repo, event, violations, api=None):
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              entry = f"### {now} — push `{(event.get('after') or '')[:7]}`\n" + "\n".join(f"- [ ] {v}" for v in violations) + "\n"
              api = api or gh_api

              api(f"repos/{repo}/labels", method="POST",
                  payload={"name": "kavosh:violation", "color": "B60205",
                           "description": "KavoshStart rule violation detected on main"},
                  allow_status=(422,))
              label = urllib.parse.quote("kavosh:violation", safe="")
              existing = api(f"repos/{repo}/issues?labels={label}&state=open&per_page=100") or []
              existing = [item for item in existing if "pull_request" not in item]
              if existing:
                  number = existing[0]["number"]
                  api(f"repos/{repo}/issues/{number}", method="PATCH",
                      payload={"body": (existing[0].get("body") or "") + "\n" + entry})
              else:
                  body = ("Violations of KavoshStart rules detected on `main`. Fix each with a PR (revert or correction), tick it, "
                          "and close this issue when all are resolved.\n"
                          "Rules: https://github.com/bagdeli/KavoshStart/blob/main/standard/RULES.md\n\n" + entry)
                  api(f"repos/{repo}/issues", method="POST",
                      payload={"title": "KavoshStart: rule violations on main",
                               "labels": ["kavosh:violation"], "body": body})
              return entry


          def main():
              repo = os.environ["REPO"]
              required = [x.strip() for x in os.environ.get("REQUIRED", ",".join(DEFAULT_REQUIRED)).split(",") if x.strip()]
              event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
                  try:
                      event = manual_dispatch_event(repo, os.environ.get("AUTHORIZED_SHA", ""),
                                                    os.environ.get("GITHUB_ACTOR", "?"), gh_api)
                  except RuntimeError as e:
                      print(str(e))
                      return 1
              try:
                  violations = inspect(event, repo, required, gh_api)
              except RuntimeError as e:
                  violations = [f"**main guard could not inspect this push** ({e}) — verify manually"]
              print("\n".join(violations) or "no violations")
              if not violations:
                  return 0
              entry = record(repo, event, violations, gh_api)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("## KavoshStart main guard\n\n" + entry)
              return 1  # a red main-guard check is itself visible and closes the REL-5 gate


          if __name__ == "__main__":
              sys.exit(main())
          PY
