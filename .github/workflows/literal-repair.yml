name: literal-repair
on:
  push:
    branches: [fix/125-literal-release-workflow]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'bagdeli/KavoshStart' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare exact literal-script fix
        run: |
          cp .literal-repair.py "$RUNNER_TEMP/literal-repair.py"
          python3 "$RUNNER_TEMP/literal-repair.py" prepare
      - name: Full core and cross-domain verification
        env:
          KAVOSH_CONFORMANCE_DEPS: ${{ runner.temp }}/literal-repair-deps
          KAVOSH_TERRAFORM: ${{ runner.temp }}/literal-repair-deps/terraform
          KAVOSH_WORDPRESS_ROOT: ${{ runner.temp }}/literal-repair-deps/wordpress
          KAVOSH_CONFORMANCE_REPORT: ${{ runner.temp }}/literal-conformance.xml
        run: |
          pip install --quiet pyyaml -r tooling/conformance-requirements.txt
          make check
          bash tooling/prepare_conformance.sh
          make conformance
      - name: Publish only verified unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/literal-repair.py" publish
