# GENERATED by tooling/build_workflows.py from tooling/src/release_gate.py — do not edit by hand.
# KavoshStart release (REL-4, REL-5): runs after CI succeeded on main (caller uses on: workflow_run).
#   1. REL-5 gate: required checks of the exact main commit must exist and have succeeded.
#   2. release-please: keeps the Release PR up to date; merging it creates tag vX.Y.Z + GitHub Release.
#   3. package (deploy.method=release-artifact): resolves the repository release.artifact adapter (or compatible Make default),
#      builds declared assets and uploads them to that Release in the SAME run because GITHUB_TOKEN releases do not trigger other workflows.
# Release PRs created with GITHUB_TOKEN may get approval-required pull_request runs. The trusted main release workflow
# dispatches the repository's real exact-head CI/governance, waits for success/failure, then writes ruleset-visible check runs
# on that exact bot release head. No owner click, PAT, no-op branch commit or protection bypass is required.
name: kavosh-release

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels. Private repos pass their self-hosted labels (CI-1), e.g. '["self-hosted","linux","x64","kavoshsms"]'
        type: string
        default: '["ubuntu-latest"]'
      required-checks:
        description: Comma-separated check names that must exist and succeed on the release commit
        type: string
        default: "required,main-guard / main-guard"
      package:
        description: Build and attach release artifacts using kavosh.project.json release.artifact (or the default Make adapter)
        type: boolean
        default: false
      required-workflow:
        description: Repository workflow path that exposes the stable required job and trusted workflow_dispatch inputs
        type: string
        default: ".github/workflows/ci.yml"
      kavosh-workflow:
        description: Repository Kavosh workflow path that supports mode=pr-check on an exact head
        type: string
        default: ".github/workflows/kavosh.yml"
    outputs:
      release-created:
        value: ${{ jobs.release.outputs.created }}
      tag:
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  actions: write

jobs:
  release:
    name: release
    # Only after a successful CI run for a push to main; a red or skipped CI never reaches the gate.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: REL-5 release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUIRED: ${{ inputs.required-checks }}
        run: |
          python3 - --repo "$REPO" --sha "$SHA" --required "$REQUIRED" --branch "${{ github.event.repository.default_branch }}" <<'PY'
          #!/usr/bin/env python3
          """Release gate (REL-5): a release may be created only from a `main` commit whose required checks
          exist AND succeeded. Missing, pending (after the wait), failed, cancelled or skipped = no release.
          CI being unavailable (e.g. billing) is never permission to release.

              python3 tooling/src/release_gate.py --repo owner/name --sha <commit>
                  [--required "required,main-guard / main-guard"] [--wait 300] [--branch main]

          Exit 0 = gate open, or the commit was superseded by a newer main head (nothing to do, not an error).
          Exit 1 = gate closed (reason printed). Writes open=true|false to $GITHUB_OUTPUT when available.
          Needs Python stdlib and GITHUB_TOKEN only. Embedded into kavosh-release.yml by build_workflows.py.
          """
          import argparse
          import base64
          import json
          import re
          import os
          import sys
          import urllib.error
          import urllib.request
          import urllib.parse
          import time

          DEFAULT_REQUIRED = ["required", "main-guard / main-guard"]
          PENDING = {"queued", "in_progress", "waiting", "requested", "pending"}


          def gh_api(path, method="GET", payload=None):
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise RuntimeError("GitHub API token is unavailable")
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  f"{base}/{path.lstrip('/')}", data=data, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {exc.code} {detail}") from exc
              return json.loads(raw) if raw.strip() else {}



          RELEASE_PR_BRANCH_RE = re.compile(r"^release-please--branches--.+--components--.+$")


          def release_pr(repo, base="main", api=None):
              """Return the single trusted same-repository github-actions release-please PR."""
              api = api or gh_api
              encoded_base = urllib.parse.quote(base, safe="")
              pulls = api(f"repos/{repo}/pulls?state=open&base={encoded_base}&per_page=100") or []
              candidates = []
              for pr in pulls:
                  head = pr.get("head") or {}
                  user = pr.get("user") or {}
                  if (
                      (pr.get("base") or {}).get("ref") == base
                      and (head.get("repo") or {}).get("full_name") == repo
                      and RELEASE_PR_BRANCH_RE.fullmatch(head.get("ref") or "")
                      and user.get("login") == "github-actions[bot]"
                  ):
                      candidates.append(pr)
              if len(candidates) > 1:
                  raise RuntimeError(
                      f"multiple trusted release-please PRs target {base}: "
                      f"{[p.get('number') for p in candidates]}"
                  )
              return candidates[0] if candidates else None


          def _workflow_id(path):
              if not isinstance(path, str) or not re.fullmatch(
                  r"[.]github/workflows/[A-Za-z0-9._-]+[.]ya?ml", path
              ):
                  raise RuntimeError(f"invalid workflow adapter path: {path!r}")
              return urllib.parse.quote(path, safe="")


          def _workflow_runs(repo, workflow, head_sha, api):
              wid = _workflow_id(workflow)
              data = api(
                  f"repos/{repo}/actions/workflows/{wid}/runs?"
                  "event=workflow_dispatch&per_page=100"
              ) or {}
              return [
                  run for run in data.get("workflow_runs", [])
                  if run.get("head_sha") == head_sha
              ]


          def _dispatch_and_wait(repo, workflow, head_ref, head_sha, inputs,
                                 wait=900, interval=5, api=None, sleep=time.sleep):
              api = api or gh_api
              before = {run.get("id") for run in _workflow_runs(repo, workflow, head_sha, api)}
              wid = _workflow_id(workflow)
              api(
                  f"repos/{repo}/actions/workflows/{wid}/dispatches",
                  method="POST",
                  payload={"ref": head_ref, "inputs": inputs},
              )
              deadline = time.monotonic() + wait
              found = None
              while time.monotonic() < deadline:
                  runs = _workflow_runs(repo, workflow, head_sha, api)
                  fresh = [run for run in runs if run.get("id") not in before]
                  if fresh:
                      fresh.sort(
                          key=lambda run: (
                              run.get("run_started_at") or run.get("created_at") or "",
                              run.get("id") or 0,
                          ),
                          reverse=True,
                      )
                      found = fresh[0]
                      if found.get("status") == "completed":
                          return found
                  sleep(interval)
              if found:
                  raise RuntimeError(
                      f"{workflow} run {found.get('id')} did not complete within {wait}s"
                  )
              raise RuntimeError(
                  f"{workflow} dispatch for {head_sha[:7]} did not produce a discoverable run"
              )


          def _publish_check(repo, sha, name, run, api):
              """Mirror one real workflow_dispatch result into both GitHub required-status channels."""
              success = run.get("status") == "completed" and run.get("conclusion") == "success"
              conclusion = "success" if success else "failure"
              details_url = run.get("html_url")
              summary = (
                  f"workflow_dispatch run {run.get('id')} concluded "
                  f"{run.get('conclusion')} for exact release head {sha}."
              )
              api(
                  f"repos/{repo}/check-runs",
                  method="POST",
                  payload={
                      "name": name,
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": conclusion,
                      "details_url": details_url,
                      "output": {
                          "title": f"Trusted release verification: {name}",
                          "summary": summary,
                      },
                  },
              )
              api(
                  f"repos/{repo}/statuses/{sha}",
                  method="POST",
                  payload={
                      "state": conclusion,
                      "target_url": details_url,
                      "description": f"Trusted workflow_dispatch verification run {run.get('id')}",
                      "context": name,
                  },
              )
              return success


          def verify_release_pr(repo, base, required_workflow, kavosh_workflow,
                                wait=900, interval=5, api=None, sleep=time.sleep):
              """Run real exact-head checks, then bridge their result into ruleset-visible check runs."""
              api = api or gh_api
              pr = release_pr(repo, base, api)
              if not pr:
                  return None
              number = pr.get("number")
              head = pr.get("head") or {}
              head_sha, head_ref = head.get("sha"), head.get("ref")
              if (
                  not isinstance(number, int)
                  or not re.fullmatch(r"[0-9a-f]{40}", head_sha or "")
                  or not head_ref
              ):
                  raise RuntimeError("trusted release PR is missing number/head identity")

              required_run = _dispatch_and_wait(
                  repo, required_workflow, head_ref, head_sha,
                  {"pr-number": str(number), "expected-head": head_sha, "ci-full": False},
                  wait, interval, api, sleep,
              )
              kavosh_run = _dispatch_and_wait(
                  repo, kavosh_workflow, head_ref, head_sha,
                  {"mode": "pr-check", "pr-number": str(number), "expected-head": head_sha},
                  wait, interval, api, sleep,
              )

              required_ok = _publish_check(repo, head_sha, "required", required_run, api)
              kavosh_ok = _publish_check(
                  repo, head_sha, "kavosh / governance", kavosh_run, api
              )
              return {
                  "number": number,
                  "head_sha": head_sha,
                  "required_run": required_run.get("id"),
                  "kavosh_run": kavosh_run.get("id"),
                  "ok": required_ok and kavosh_ok,
              }


          def check_runs(repo, sha, api=None):
              api = api or gh_api
              runs, page = [], 1
              while True:
                  data = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100&page={page}")
                  batch = data.get("check_runs", [])
                  runs += batch
                  if len(batch) < 100:
                      return runs
                  page += 1


          def evaluate(runs, required):
              """Return (open, pending, reasons). The newest run per name wins (re-runs replace older results)."""
              latest = {}
              pending_runs = {}
              for r in runs:
                  name = r.get("name", "")
                  if r.get("status") != "completed":
                      pending_runs[name] = r
                  stamp = r.get("started_at") or r.get("created_at") or ""
                  previous = latest.get(name, {})
                  previous_stamp = previous.get("started_at") or previous.get("created_at") or ""
                  pending_now = r.get("status") != "completed"
                  pending_previous = previous.get("status") != "completed"
                  if (name not in latest or stamp > previous_stamp or
                          (pending_now and not pending_previous and (not stamp or stamp == previous_stamp))):
                      latest[name] = r
              latest.update(pending_runs)
              reasons, pending = [], False
              for name in required:
                  r = latest.get(name)
                  if r is None:
                      reasons.append(f"missing required check '{name}'")
                  elif r.get("status") in PENDING:
                      pending = True
                      reasons.append(f"'{name}' is still {r.get('status')}")
                  elif r.get("conclusion") != "success":
                      reasons.append(f"'{name}' concluded {r.get('conclusion')}")
              return (not reasons), pending, reasons


          ACCEPTANCE_SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          ACCEPTANCE_RELEASE_RE = re.compile(r"^v([0-9]+)[.]([0-9]+)[.]([0-9]+)$")
          ACCEPTANCE_RUN_URL = re.compile(r"^https://github[.]com/([^/]+/[^/]+)/actions/runs/([0-9]+)(?:[/?#].*)?$")


          def _json_file(repo, path, sha, api):
              raw = api(f"repos/{repo}/contents/{path}?ref={sha}")
              encoded = raw.get("content") if isinstance(raw, dict) else None
              if not encoded:
                  raise RuntimeError(f"missing {path} at candidate SHA")
              try:
                  return json.loads(base64.b64decode(encoded).decode("utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  raise RuntimeError(f"invalid JSON in {path}: {exc}") from exc


          def _marker(body, name):
              m = re.search(rf"(?im)^\s*{re.escape(name)}:\s*(\S.+?)\s*$", body or "")
              return m.group(1).strip() if m else None


          def acceptance_reasons(repo, sha, api=None):
              """ACC-3: release-readiness from versioned scope + live GitHub Issue/Actions evidence."""
              api = api or gh_api
              manifest = _json_file(repo, "kavosh.project.json", sha, api)
              if manifest.get("acceptance", {}).get("mode", "none") != "continuous":
                  return []
              scope = _json_file(repo, "acceptance/scope.json", sha, api)
              reasons = []
              if scope.get("schemaVersion") != 1:
                  reasons.append("acceptance scope schemaVersion must be 1")
              target = scope.get("targetRelease")
              tm = ACCEPTANCE_RELEASE_RE.fullmatch(target or "")
              if not tm:
                  reasons.append("acceptance targetRelease must match vX.Y.Z")
              items = scope.get("items")
              if not isinstance(items, list) or not items:
                  return reasons + ["continuous acceptance scope must contain at least one item"]
              target_tuple = tuple(map(int, tm.groups())) if tm else None
              seen = set()
              marker_for = {
                  "test": "Acceptance-Test-Evidence",
                  "ui": "Acceptance-UI-Evidence",
                  "security": "Acceptance-Security-Evidence",
                  "migration": "Acceptance-Migration-Evidence",
              }
              for item in items:
                  if not isinstance(item, dict):
                      reasons.append("acceptance scope contains a non-object item")
                      continue
                  aid = item.get("id") or "<missing-id>"
                  if aid in seen:
                      reasons.append(f"{aid}: duplicate acceptance ID")
                      continue
                  seen.add(aid)
                  owner = item.get("owner")
                  issue_no = item.get("issue")
                  risk = item.get("risk")
                  evidence = item.get("evidence") if isinstance(item.get("evidence"), list) else []
                  if not isinstance(owner, str) or not owner:
                      reasons.append(f"{aid}: invalid owner")
                      continue
                  if risk not in ("low", "medium", "high", "critical"):
                      reasons.append(f"{aid}: invalid risk")
                      continue
                  if not evidence or "ci" not in evidence:
                      reasons.append(f"{aid}: evidence must include ci")
                      continue
                  if risk in ("high", "critical") and "test" not in evidence:
                      reasons.append(f"{aid}: high/critical risk requires test evidence")
                      continue
                  deferred = item.get("deferredTo")
                  if deferred:
                      dm = ACCEPTANCE_RELEASE_RE.fullmatch(deferred) if isinstance(deferred, str) else None
                      defer_issue = item.get("deferIssue")
                      if not dm or not target_tuple or tuple(map(int, dm.groups())) <= target_tuple:
                          reasons.append(f"{aid}: invalid deferredTo")
                          continue
                      if not isinstance(defer_issue, int) or defer_issue <= 0:
                          reasons.append(f"{aid}: deferIssue required")
                          continue
                      issue = api(f"repos/{repo}/issues/{defer_issue}")
                      if issue.get("state") != "closed":
                          reasons.append(f"{aid}: defer approval issue #{defer_issue} is not closed")
                          continue
                      approved = _marker(issue.get("body") or "", "Defer-Approved-By")
                      if approved != f"@{owner}":
                          reasons.append(f"{aid}: defer is not approved by @{owner}")
                      continue

                  if not isinstance(issue_no, int) or issue_no <= 0:
                      reasons.append(f"{aid}: invalid canonical issue")
                      continue
                  issue = api(f"repos/{repo}/issues/{issue_no}")
                  body = issue.get("body") or ""
                  if issue.get("state") != "closed":
                      reasons.append(f"{aid}: acceptance issue #{issue_no} is not closed")
                      continue
                  accepted_by = _marker(body, "Accepted-By")
                  if accepted_by != f"@{owner}":
                      reasons.append(f"{aid}: missing Accepted-By: @{owner}")
                  merged_sha = _marker(body, "Acceptance-Merged-SHA")
                  if not merged_sha or not ACCEPTANCE_SHA_RE.fullmatch(merged_sha):
                      reasons.append(f"{aid}: missing valid Acceptance-Merged-SHA")
                  else:
                      cmp = api(f"repos/{repo}/compare/{merged_sha}...{sha}")
                      if cmp.get("status") not in ("ahead", "identical"):
                          reasons.append(f"{aid}: merged SHA is not an ancestor of candidate")
                  run_url = _marker(body, "Acceptance-Evidence-Run")
                  rm = ACCEPTANCE_RUN_URL.fullmatch(run_url or "")
                  if not rm or rm.group(1).lower() != repo.lower():
                      reasons.append(f"{aid}: missing same-repository Actions Acceptance-Evidence-Run")
                  else:
                      run = api(f"repos/{repo}/actions/runs/{rm.group(2)}")
                      if run.get("status") != "completed" or run.get("conclusion") != "success":
                          reasons.append(f"{aid}: referenced Actions evidence run is not successful")
                  for ev in evidence:
                      marker = marker_for.get(ev)
                      if marker and not re.match(r"^https://\S+$", _marker(body, marker) or ""):
                          reasons.append(f"{aid}: missing {marker}")
              return reasons


          def gate(repo, sha, required, branch="main", wait=300, interval=15, api=None, sleep=time.sleep):
              api = api or gh_api
              required = list(dict.fromkeys(required or []))
              if not set(DEFAULT_REQUIRED).issubset(required):
                  return False, [f"required checks must include {', '.join(DEFAULT_REQUIRED)}"]
              head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
              if head != sha:
                  return None, [f"{sha[:7]} is not the current head of {branch} ({(head or '?')[:7]}); the next run will handle the newer commit"]
              deadline = time.monotonic() + wait
              while True:
                  ok, pending, reasons = evaluate(check_runs(repo, sha, api), required)
                  if ok or not pending or time.monotonic() >= deadline:
                      final_head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
                      if final_head != sha:
                          return None, [f"{sha[:7]} stopped being the current head of {branch} during validation"]
                      return ok, reasons
                  sleep(interval)


          def main(argv=None):
              p = argparse.ArgumentParser(description=__doc__.splitlines()[0])
              p.add_argument("--repo", required=True)
              p.add_argument("--sha")
              p.add_argument("--branch", default="main")
              p.add_argument("--required", default=",".join(DEFAULT_REQUIRED))
              p.add_argument("--wait", type=int, default=300, help="seconds to wait for pending required checks")
              p.add_argument("--verify-release-pr", action="store_true")
              p.add_argument("--required-workflow", default=".github/workflows/ci.yml")
              p.add_argument("--kavosh-workflow", default=".github/workflows/kavosh.yml")
              p.add_argument("--verification-wait", type=int, default=900)
              a = p.parse_args(argv)

              if a.verify_release_pr:
                  try:
                      verified = verify_release_pr(
                          a.repo, a.branch, a.required_workflow, a.kavosh_workflow,
                          wait=a.verification_wait,
                      )
                  except RuntimeError as e:
                      print(f"Release PR verification FAILED: {e}")
                      return 1
                  if verified is None:
                      print(f"No trusted open release-please PR targets {a.branch}; nothing to verify")
                      return 0
                  if not verified["ok"]:
                      print(
                          f"Release PR #{verified['number']} exact-head verification failed "
                          f"for {verified['head_sha']}"
                      )
                      return 1
                  print(
                      f"Release PR #{verified['number']} verified at {verified['head_sha']}; "
                      "ruleset-visible required checks published"
                  )
                  return 0

              if not a.sha:
                  p.error("--sha is required unless --verify-release-pr is used")
              required = [x.strip() for x in a.required.split(",") if x.strip()]
              if not required:
                  print("REL-5: no required checks configured — refusing to open the gate")
                  return 1
              try:
                  ok, reasons = gate(a.repo, a.sha, required, a.branch, a.wait)
              except RuntimeError as e:
                  print(f"REL-5 gate CLOSED: cannot read checks ({e}) — unavailable CI is not permission to release")
                  return 1
              out = os.environ.get("GITHUB_OUTPUT")
              def write_open(value):
                  if out:
                      with open(out, "a", encoding="utf-8") as fh:
                          fh.write(f"open={'true' if value else 'false'}\n")
              write_open(False)
              if ok is None:
                  print(f"REL-5: {reasons[0]} — skipping")
                  return 0
              if ok:
                  try:
                      acceptance = acceptance_reasons(a.repo, a.sha)
                  except RuntimeError as e:
                      print(f"ACC-3 gate CLOSED: cannot read acceptance evidence ({e})")
                      return 1
                  if acceptance:
                      print(f"ACC-3 gate CLOSED for {a.sha[:7]}:")
                      for reason in acceptance:
                          print(f"  - {reason}")
                      return 1
                  write_open(True)
                  print(f"REL-5/ACC-3 gate OPEN for {a.sha[:7]}: required checks and acceptance readiness succeeded")
                  return 0
              print(f"REL-5 gate CLOSED for {a.sha[:7]}:")
              for r in reasons:
                  print(f"  - {r}")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY
      - name: release-please
        id: rp
        if: steps.gate.outputs.open == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Verify exact release PR head and publish required checks
        if: steps.gate.outputs.open == 'true' && steps.rp.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          REQUIRED_WORKFLOW: ${{ inputs.required-workflow }}
          KAVOSH_WORKFLOW: ${{ inputs.kavosh-workflow }}
        run: |
          python3 - --verify-release-pr --repo "$REPO" --branch "$BASE" \
            --required-workflow "$REQUIRED_WORKFLOW" --kavosh-workflow "$KAVOSH_WORKFLOW" <<'PY'
          #!/usr/bin/env python3
          """Release gate (REL-5): a release may be created only from a `main` commit whose required checks
          exist AND succeeded. Missing, pending (after the wait), failed, cancelled or skipped = no release.
          CI being unavailable (e.g. billing) is never permission to release.

              python3 tooling/src/release_gate.py --repo owner/name --sha <commit>
                  [--required "required,main-guard / main-guard"] [--wait 300] [--branch main]

          Exit 0 = gate open, or the commit was superseded by a newer main head (nothing to do, not an error).
          Exit 1 = gate closed (reason printed). Writes open=true|false to $GITHUB_OUTPUT when available.
          Needs Python stdlib and GITHUB_TOKEN only. Embedded into kavosh-release.yml by build_workflows.py.
          """
          import argparse
          import base64
          import json
          import re
          import os
          import sys
          import urllib.error
          import urllib.request
          import urllib.parse
          import time

          DEFAULT_REQUIRED = ["required", "main-guard / main-guard"]
          PENDING = {"queued", "in_progress", "waiting", "requested", "pending"}


          def gh_api(path, method="GET", payload=None):
              base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise RuntimeError("GitHub API token is unavailable")
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  f"{base}/{path.lstrip('/')}", data=data, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {exc.code} {detail}") from exc
              return json.loads(raw) if raw.strip() else {}



          RELEASE_PR_BRANCH_RE = re.compile(r"^release-please--branches--.+--components--.+$")


          def release_pr(repo, base="main", api=None):
              """Return the single trusted same-repository github-actions release-please PR."""
              api = api or gh_api
              encoded_base = urllib.parse.quote(base, safe="")
              pulls = api(f"repos/{repo}/pulls?state=open&base={encoded_base}&per_page=100") or []
              candidates = []
              for pr in pulls:
                  head = pr.get("head") or {}
                  user = pr.get("user") or {}
                  if (
                      (pr.get("base") or {}).get("ref") == base
                      and (head.get("repo") or {}).get("full_name") == repo
                      and RELEASE_PR_BRANCH_RE.fullmatch(head.get("ref") or "")
                      and user.get("login") == "github-actions[bot]"
                  ):
                      candidates.append(pr)
              if len(candidates) > 1:
                  raise RuntimeError(
                      f"multiple trusted release-please PRs target {base}: "
                      f"{[p.get('number') for p in candidates]}"
                  )
              return candidates[0] if candidates else None


          def _workflow_id(path):
              if not isinstance(path, str) or not re.fullmatch(
                  r"[.]github/workflows/[A-Za-z0-9._-]+[.]ya?ml", path
              ):
                  raise RuntimeError(f"invalid workflow adapter path: {path!r}")
              return urllib.parse.quote(path, safe="")


          def _workflow_runs(repo, workflow, head_sha, api):
              wid = _workflow_id(workflow)
              data = api(
                  f"repos/{repo}/actions/workflows/{wid}/runs?"
                  "event=workflow_dispatch&per_page=100"
              ) or {}
              return [
                  run for run in data.get("workflow_runs", [])
                  if run.get("head_sha") == head_sha
              ]


          def _dispatch_and_wait(repo, workflow, head_ref, head_sha, inputs,
                                 wait=900, interval=5, api=None, sleep=time.sleep):
              api = api or gh_api
              before = {run.get("id") for run in _workflow_runs(repo, workflow, head_sha, api)}
              wid = _workflow_id(workflow)
              api(
                  f"repos/{repo}/actions/workflows/{wid}/dispatches",
                  method="POST",
                  payload={"ref": head_ref, "inputs": inputs},
              )
              deadline = time.monotonic() + wait
              found = None
              while time.monotonic() < deadline:
                  runs = _workflow_runs(repo, workflow, head_sha, api)
                  fresh = [run for run in runs if run.get("id") not in before]
                  if fresh:
                      fresh.sort(
                          key=lambda run: (
                              run.get("run_started_at") or run.get("created_at") or "",
                              run.get("id") or 0,
                          ),
                          reverse=True,
                      )
                      found = fresh[0]
                      if found.get("status") == "completed":
                          return found
                  sleep(interval)
              if found:
                  raise RuntimeError(
                      f"{workflow} run {found.get('id')} did not complete within {wait}s"
                  )
              raise RuntimeError(
                  f"{workflow} dispatch for {head_sha[:7]} did not produce a discoverable run"
              )


          def _publish_check(repo, sha, name, run, api):
              """Mirror one real workflow_dispatch result into both GitHub required-status channels."""
              success = run.get("status") == "completed" and run.get("conclusion") == "success"
              conclusion = "success" if success else "failure"
              details_url = run.get("html_url")
              summary = (
                  f"workflow_dispatch run {run.get('id')} concluded "
                  f"{run.get('conclusion')} for exact release head {sha}."
              )
              api(
                  f"repos/{repo}/check-runs",
                  method="POST",
                  payload={
                      "name": name,
                      "head_sha": sha,
                      "status": "completed",
                      "conclusion": conclusion,
                      "details_url": details_url,
                      "output": {
                          "title": f"Trusted release verification: {name}",
                          "summary": summary,
                      },
                  },
              )
              api(
                  f"repos/{repo}/statuses/{sha}",
                  method="POST",
                  payload={
                      "state": conclusion,
                      "target_url": details_url,
                      "description": f"Trusted workflow_dispatch verification run {run.get('id')}",
                      "context": name,
                  },
              )
              return success


          def verify_release_pr(repo, base, required_workflow, kavosh_workflow,
                                wait=900, interval=5, api=None, sleep=time.sleep):
              """Run real exact-head checks, then bridge their result into ruleset-visible check runs."""
              api = api or gh_api
              pr = release_pr(repo, base, api)
              if not pr:
                  return None
              number = pr.get("number")
              head = pr.get("head") or {}
              head_sha, head_ref = head.get("sha"), head.get("ref")
              if (
                  not isinstance(number, int)
                  or not re.fullmatch(r"[0-9a-f]{40}", head_sha or "")
                  or not head_ref
              ):
                  raise RuntimeError("trusted release PR is missing number/head identity")

              required_run = _dispatch_and_wait(
                  repo, required_workflow, head_ref, head_sha,
                  {"pr-number": str(number), "expected-head": head_sha, "ci-full": False},
                  wait, interval, api, sleep,
              )
              kavosh_run = _dispatch_and_wait(
                  repo, kavosh_workflow, head_ref, head_sha,
                  {"mode": "pr-check", "pr-number": str(number), "expected-head": head_sha},
                  wait, interval, api, sleep,
              )

              required_ok = _publish_check(repo, head_sha, "required", required_run, api)
              kavosh_ok = _publish_check(
                  repo, head_sha, "kavosh / governance", kavosh_run, api
              )
              return {
                  "number": number,
                  "head_sha": head_sha,
                  "required_run": required_run.get("id"),
                  "kavosh_run": kavosh_run.get("id"),
                  "ok": required_ok and kavosh_ok,
              }


          def check_runs(repo, sha, api=None):
              api = api or gh_api
              runs, page = [], 1
              while True:
                  data = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100&page={page}")
                  batch = data.get("check_runs", [])
                  runs += batch
                  if len(batch) < 100:
                      return runs
                  page += 1


          def evaluate(runs, required):
              """Return (open, pending, reasons). The newest run per name wins (re-runs replace older results)."""
              latest = {}
              pending_runs = {}
              for r in runs:
                  name = r.get("name", "")
                  if r.get("status") != "completed":
                      pending_runs[name] = r
                  stamp = r.get("started_at") or r.get("created_at") or ""
                  previous = latest.get(name, {})
                  previous_stamp = previous.get("started_at") or previous.get("created_at") or ""
                  pending_now = r.get("status") != "completed"
                  pending_previous = previous.get("status") != "completed"
                  if (name not in latest or stamp > previous_stamp or
                          (pending_now and not pending_previous and (not stamp or stamp == previous_stamp))):
                      latest[name] = r
              latest.update(pending_runs)
              reasons, pending = [], False
              for name in required:
                  r = latest.get(name)
                  if r is None:
                      reasons.append(f"missing required check '{name}'")
                  elif r.get("status") in PENDING:
                      pending = True
                      reasons.append(f"'{name}' is still {r.get('status')}")
                  elif r.get("conclusion") != "success":
                      reasons.append(f"'{name}' concluded {r.get('conclusion')}")
              return (not reasons), pending, reasons


          ACCEPTANCE_SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          ACCEPTANCE_RELEASE_RE = re.compile(r"^v([0-9]+)[.]([0-9]+)[.]([0-9]+)$")
          ACCEPTANCE_RUN_URL = re.compile(r"^https://github[.]com/([^/]+/[^/]+)/actions/runs/([0-9]+)(?:[/?#].*)?$")


          def _json_file(repo, path, sha, api):
              raw = api(f"repos/{repo}/contents/{path}?ref={sha}")
              encoded = raw.get("content") if isinstance(raw, dict) else None
              if not encoded:
                  raise RuntimeError(f"missing {path} at candidate SHA")
              try:
                  return json.loads(base64.b64decode(encoded).decode("utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  raise RuntimeError(f"invalid JSON in {path}: {exc}") from exc


          def _marker(body, name):
              m = re.search(rf"(?im)^\s*{re.escape(name)}:\s*(\S.+?)\s*$", body or "")
              return m.group(1).strip() if m else None


          def acceptance_reasons(repo, sha, api=None):
              """ACC-3: release-readiness from versioned scope + live GitHub Issue/Actions evidence."""
              api = api or gh_api
              manifest = _json_file(repo, "kavosh.project.json", sha, api)
              if manifest.get("acceptance", {}).get("mode", "none") != "continuous":
                  return []
              scope = _json_file(repo, "acceptance/scope.json", sha, api)
              reasons = []
              if scope.get("schemaVersion") != 1:
                  reasons.append("acceptance scope schemaVersion must be 1")
              target = scope.get("targetRelease")
              tm = ACCEPTANCE_RELEASE_RE.fullmatch(target or "")
              if not tm:
                  reasons.append("acceptance targetRelease must match vX.Y.Z")
              items = scope.get("items")
              if not isinstance(items, list) or not items:
                  return reasons + ["continuous acceptance scope must contain at least one item"]
              target_tuple = tuple(map(int, tm.groups())) if tm else None
              seen = set()
              marker_for = {
                  "test": "Acceptance-Test-Evidence",
                  "ui": "Acceptance-UI-Evidence",
                  "security": "Acceptance-Security-Evidence",
                  "migration": "Acceptance-Migration-Evidence",
              }
              for item in items:
                  if not isinstance(item, dict):
                      reasons.append("acceptance scope contains a non-object item")
                      continue
                  aid = item.get("id") or "<missing-id>"
                  if aid in seen:
                      reasons.append(f"{aid}: duplicate acceptance ID")
                      continue
                  seen.add(aid)
                  owner = item.get("owner")
                  issue_no = item.get("issue")
                  risk = item.get("risk")
                  evidence = item.get("evidence") if isinstance(item.get("evidence"), list) else []
                  if not isinstance(owner, str) or not owner:
                      reasons.append(f"{aid}: invalid owner")
                      continue
                  if risk not in ("low", "medium", "high", "critical"):
                      reasons.append(f"{aid}: invalid risk")
                      continue
                  if not evidence or "ci" not in evidence:
                      reasons.append(f"{aid}: evidence must include ci")
                      continue
                  if risk in ("high", "critical") and "test" not in evidence:
                      reasons.append(f"{aid}: high/critical risk requires test evidence")
                      continue
                  deferred = item.get("deferredTo")
                  if deferred:
                      dm = ACCEPTANCE_RELEASE_RE.fullmatch(deferred) if isinstance(deferred, str) else None
                      defer_issue = item.get("deferIssue")
                      if not dm or not target_tuple or tuple(map(int, dm.groups())) <= target_tuple:
                          reasons.append(f"{aid}: invalid deferredTo")
                          continue
                      if not isinstance(defer_issue, int) or defer_issue <= 0:
                          reasons.append(f"{aid}: deferIssue required")
                          continue
                      issue = api(f"repos/{repo}/issues/{defer_issue}")
                      if issue.get("state") != "closed":
                          reasons.append(f"{aid}: defer approval issue #{defer_issue} is not closed")
                          continue
                      approved = _marker(issue.get("body") or "", "Defer-Approved-By")
                      if approved != f"@{owner}":
                          reasons.append(f"{aid}: defer is not approved by @{owner}")
                      continue

                  if not isinstance(issue_no, int) or issue_no <= 0:
                      reasons.append(f"{aid}: invalid canonical issue")
                      continue
                  issue = api(f"repos/{repo}/issues/{issue_no}")
                  body = issue.get("body") or ""
                  if issue.get("state") != "closed":
                      reasons.append(f"{aid}: acceptance issue #{issue_no} is not closed")
                      continue
                  accepted_by = _marker(body, "Accepted-By")
                  if accepted_by != f"@{owner}":
                      reasons.append(f"{aid}: missing Accepted-By: @{owner}")
                  merged_sha = _marker(body, "Acceptance-Merged-SHA")
                  if not merged_sha or not ACCEPTANCE_SHA_RE.fullmatch(merged_sha):
                      reasons.append(f"{aid}: missing valid Acceptance-Merged-SHA")
                  else:
                      cmp = api(f"repos/{repo}/compare/{merged_sha}...{sha}")
                      if cmp.get("status") not in ("ahead", "identical"):
                          reasons.append(f"{aid}: merged SHA is not an ancestor of candidate")
                  run_url = _marker(body, "Acceptance-Evidence-Run")
                  rm = ACCEPTANCE_RUN_URL.fullmatch(run_url or "")
                  if not rm or rm.group(1).lower() != repo.lower():
                      reasons.append(f"{aid}: missing same-repository Actions Acceptance-Evidence-Run")
                  else:
                      run = api(f"repos/{repo}/actions/runs/{rm.group(2)}")
                      if run.get("status") != "completed" or run.get("conclusion") != "success":
                          reasons.append(f"{aid}: referenced Actions evidence run is not successful")
                  for ev in evidence:
                      marker = marker_for.get(ev)
                      if marker and not re.match(r"^https://\S+$", _marker(body, marker) or ""):
                          reasons.append(f"{aid}: missing {marker}")
              return reasons


          def gate(repo, sha, required, branch="main", wait=300, interval=15, api=None, sleep=time.sleep):
              api = api or gh_api
              required = list(dict.fromkeys(required or []))
              if not set(DEFAULT_REQUIRED).issubset(required):
                  return False, [f"required checks must include {', '.join(DEFAULT_REQUIRED)}"]
              head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
              if head != sha:
                  return None, [f"{sha[:7]} is not the current head of {branch} ({(head or '?')[:7]}); the next run will handle the newer commit"]
              deadline = time.monotonic() + wait
              while True:
                  ok, pending, reasons = evaluate(check_runs(repo, sha, api), required)
                  if ok or not pending or time.monotonic() >= deadline:
                      final_head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
                      if final_head != sha:
                          return None, [f"{sha[:7]} stopped being the current head of {branch} during validation"]
                      return ok, reasons
                  sleep(interval)


          def main(argv=None):
              p = argparse.ArgumentParser(description=__doc__.splitlines()[0])
              p.add_argument("--repo", required=True)
              p.add_argument("--sha")
              p.add_argument("--branch", default="main")
              p.add_argument("--required", default=",".join(DEFAULT_REQUIRED))
              p.add_argument("--wait", type=int, default=300, help="seconds to wait for pending required checks")
              p.add_argument("--verify-release-pr", action="store_true")
              p.add_argument("--required-workflow", default=".github/workflows/ci.yml")
              p.add_argument("--kavosh-workflow", default=".github/workflows/kavosh.yml")
              p.add_argument("--verification-wait", type=int, default=900)
              a = p.parse_args(argv)

              if a.verify_release_pr:
                  try:
                      verified = verify_release_pr(
                          a.repo, a.branch, a.required_workflow, a.kavosh_workflow,
                          wait=a.verification_wait,
                      )
                  except RuntimeError as e:
                      print(f"Release PR verification FAILED: {e}")
                      return 1
                  if verified is None:
                      print(f"No trusted open release-please PR targets {a.branch}; nothing to verify")
                      return 0
                  if not verified["ok"]:
                      print(
                          f"Release PR #{verified['number']} exact-head verification failed "
                          f"for {verified['head_sha']}"
                      )
                      return 1
                  print(
                      f"Release PR #{verified['number']} verified at {verified['head_sha']}; "
                      "ruleset-visible required checks published"
                  )
                  return 0

              if not a.sha:
                  p.error("--sha is required unless --verify-release-pr is used")
              required = [x.strip() for x in a.required.split(",") if x.strip()]
              if not required:
                  print("REL-5: no required checks configured — refusing to open the gate")
                  return 1
              try:
                  ok, reasons = gate(a.repo, a.sha, required, a.branch, a.wait)
              except RuntimeError as e:
                  print(f"REL-5 gate CLOSED: cannot read checks ({e}) — unavailable CI is not permission to release")
                  return 1
              out = os.environ.get("GITHUB_OUTPUT")
              def write_open(value):
                  if out:
                      with open(out, "a", encoding="utf-8") as fh:
                          fh.write(f"open={'true' if value else 'false'}\n")
              write_open(False)
              if ok is None:
                  print(f"REL-5: {reasons[0]} — skipping")
                  return 0
              if ok:
                  try:
                      acceptance = acceptance_reasons(a.repo, a.sha)
                  except RuntimeError as e:
                      print(f"ACC-3 gate CLOSED: cannot read acceptance evidence ({e})")
                      return 1
                  if acceptance:
                      print(f"ACC-3 gate CLOSED for {a.sha[:7]}:")
                      for reason in acceptance:
                          print(f"  - {reason}")
                      return 1
                  write_open(True)
                  print(f"REL-5/ACC-3 gate OPEN for {a.sha[:7]}: required checks and acceptance readiness succeeded")
                  return 0
              print(f"REL-5 gate CLOSED for {a.sha[:7]}:")
              for r in reasons:
                  print(f"  - {r}")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY

  package:
    name: package
    needs: release
    if: inputs.package && needs.release.outputs.created == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') != ''
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') == ''
        with:
          node-version: "lts/*"
      - name: Resolve release artifact adapter
        env:
          KAVOSH_ARTIFACT_SCRIPT: ${{ runner.temp }}/kavosh-release-artifact.sh
          KAVOSH_ARTIFACT_PATHS: ${{ runner.temp }}/kavosh-release-artifact-paths.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          manifest = json.loads(pathlib.Path("kavosh.project.json").read_text(encoding="utf-8"))
          release = manifest.get("release", {}) or {}
          artifact = release.get("artifact")
          interface = (manifest.get("automation", {}) or {}).get("interface", "make")
          if artifact:
              command = artifact.get("command")
              paths = artifact.get("paths")
          elif interface == "make":
              command = "make setup\nmake package"
              paths = ["dist/*"]
          else:
              sys.exit(f"REL-4: automation.interface={interface} requires release.artifact.command + paths")
          if not isinstance(command, str) or not command.strip():
              sys.exit("REL-4: release.artifact.command must be non-empty")
          if not isinstance(paths, list) or not paths or any(not isinstance(p, str) or not p for p in paths):
              sys.exit("REL-4: release.artifact.paths must be a non-empty list")
          for pattern in paths:
              pure = pathlib.PurePosixPath(pattern)
              if pure.is_absolute() or ".." in pure.parts:
                  sys.exit(f"REL-4: unsafe release artifact path: {pattern}")
          script = pathlib.Path(os.environ["KAVOSH_ARTIFACT_SCRIPT"])
          script.write_text("#!/usr/bin/env bash\nset -euo pipefail\n" + command.rstrip() + "\n", encoding="utf-8")
          script.chmod(0o700)
          pathlib.Path(os.environ["KAVOSH_ARTIFACT_PATHS"]).write_text(json.dumps(paths), encoding="utf-8")
          print(f"release artifact adapter: {interface}; {len(paths)} path pattern(s)")
          PY
      - name: Build release artifacts
        env:
          KAVOSH_ARTIFACT_SCRIPT: ${{ runner.temp }}/kavosh-release-artifact.sh
        run: bash "$KAVOSH_ARTIFACT_SCRIPT"
      - name: Attach declared artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
          KAVOSH_ARTIFACT_PATHS: ${{ runner.temp }}/kavosh-release-artifact-paths.json
        run: |
          python3 - <<'PY'
          import glob, json, mimetypes, os, pathlib, sys, urllib.error, urllib.parse, urllib.request

          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          if not token:
              sys.exit("GitHub API token is unavailable")
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          root = pathlib.Path.cwd().resolve()
          patterns = json.loads(pathlib.Path(os.environ["KAVOSH_ARTIFACT_PATHS"]).read_text(encoding="utf-8"))
          files = []
          for pattern in patterns:
              for raw in glob.glob(pattern, recursive=True):
                  path = pathlib.Path(raw)
                  if path.is_symlink():
                      sys.exit(f"REL-4: release artifact symlink is forbidden: {raw}")
                  if not path.is_file():
                      continue
                  resolved = path.resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      sys.exit(f"REL-4: release artifact escapes repository: {raw}")
                  files.append(resolved)
          files = sorted(set(files))
          if not files:
              sys.exit(f"REL-4: release artifact adapter produced no files for {patterns}")
          names = [p.name for p in files]
          if len(names) != len(set(names)):
              sys.exit("REL-4: release artifacts must have unique basenames")

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(url, method="GET", data=None, extra=None):
              h = dict(headers)
              if extra:
                  h.update(extra)
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw) if raw.strip() else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} failed: HTTP {exc.code} {detail}") from exc

          release = request(f"{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag, safe='')}")
          existing = {a.get("name") for a in release.get("assets", [])}
          duplicates = [name for name in names if name in existing]
          if duplicates:
              sys.exit(f"REL-4: refusing to overwrite existing release asset(s): {duplicates}")
          upload_base = release["upload_url"].split("{", 1)[0]
          for path in files:
              data = path.read_bytes()
              ctype = mimetypes.guess_type(path.name)[0] or "application/octet-stream"
              url = upload_base + "?" + urllib.parse.urlencode({"name": path.name})
              request(url, method="POST", data=data, extra={"Content-Type": ctype})
              print(f"uploaded release asset: {path.relative_to(root)}")
          PY
