# GENERATED by tooling/build_workflows.py from tooling/src/release_gate.py — do not edit by hand.
# KavoshStart release (REL-4, REL-5): runs after CI succeeded on main (caller uses on: workflow_run).
#   1. REL-5 gate: required checks of the exact main commit must exist and have succeeded.
#   2. release-please: keeps the Release PR up to date; merging it creates tag vX.Y.Z + GitHub Release.
#   3. package (runtime none/desktop): builds `make package` → dist/* and uploads to that Release in the SAME run,
#      because releases created with GITHUB_TOKEN do not trigger other workflows.
# Release PRs are created with GITHUB_TOKEN: their CI runs need "Approve and run" by the owner (GitHub rule).
name: kavosh-release

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels. Private repos pass their self-hosted labels (CI-1), e.g. '["self-hosted","linux","x64","kavoshsms"]'
        type: string
        default: '["ubuntu-latest"]'
      required-checks:
        description: Comma-separated check names that must exist and succeed on the release commit
        type: string
        default: "required,main-guard / main-guard"
      package:
        description: Build `make package` and attach dist/* to a newly created release (runtime none/desktop)
        type: boolean
        default: false
    outputs:
      release-created:
        value: ${{ jobs.release.outputs.created }}
      tag:
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  release:
    name: release
    # Only after a successful CI run for a push to main; a red or skipped CI never reaches the gate.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: REL-5 release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REQUIRED: ${{ inputs.required-checks }}
        run: |
          python3 - --repo "$REPO" --sha "$SHA" --required "$REQUIRED" --branch "${{ github.event.repository.default_branch }}" <<'PY'
          #!/usr/bin/env python3
          """Release gate (REL-5): a release may be created only from a `main` commit whose required checks
          exist AND succeeded. Missing, pending (after the wait), failed, cancelled or skipped = no release.
          CI being unavailable (e.g. billing) is never permission to release.

              python3 tooling/src/release_gate.py --repo owner/name --sha <commit>
                  [--required "required,main-guard / main-guard"] [--wait 300] [--branch main]

          Exit 0 = gate open, or the commit was superseded by a newer main head (nothing to do, not an error).
          Exit 1 = gate closed (reason printed). Writes open=true|false to $GITHUB_OUTPUT when available.
          Needs gh (GH_TOKEN) and python3 stdlib only. Embedded into kavosh-release.yml by build_workflows.py.
          """
          import argparse
          import base64
          import json
          import re
          import os
          import subprocess
          import sys
          import time

          DEFAULT_REQUIRED = ["required", "main-guard / main-guard"]
          PENDING = {"queued", "in_progress", "waiting", "requested", "pending"}


          def gh_api(path):
              r = subprocess.run(["gh", "api", path], capture_output=True, text=True, encoding="utf-8")
              if r.returncode != 0:
                  raise RuntimeError(f"gh api {path}: {r.stderr.strip()}")
              return json.loads(r.stdout) if r.stdout.strip() else {}


          def check_runs(repo, sha, api=None):
              api = api or gh_api
              runs, page = [], 1
              while True:
                  data = api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100&page={page}")
                  batch = data.get("check_runs", [])
                  runs += batch
                  if len(batch) < 100:
                      return runs
                  page += 1


          def evaluate(runs, required):
              """Return (open, pending, reasons). The newest run per name wins (re-runs replace older results)."""
              latest = {}
              pending_runs = {}
              for r in runs:
                  name = r.get("name", "")
                  if r.get("status") != "completed":
                      pending_runs[name] = r
                  stamp = r.get("started_at") or r.get("created_at") or ""
                  previous = latest.get(name, {})
                  previous_stamp = previous.get("started_at") or previous.get("created_at") or ""
                  pending_now = r.get("status") != "completed"
                  pending_previous = previous.get("status") != "completed"
                  if (name not in latest or stamp > previous_stamp or
                          (pending_now and not pending_previous and (not stamp or stamp == previous_stamp))):
                      latest[name] = r
              latest.update(pending_runs)
              reasons, pending = [], False
              for name in required:
                  r = latest.get(name)
                  if r is None:
                      reasons.append(f"missing required check '{name}'")
                  elif r.get("status") in PENDING:
                      pending = True
                      reasons.append(f"'{name}' is still {r.get('status')}")
                  elif r.get("conclusion") != "success":
                      reasons.append(f"'{name}' concluded {r.get('conclusion')}")
              return (not reasons), pending, reasons


          ACCEPTANCE_SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          ACCEPTANCE_RELEASE_RE = re.compile(r"^v([0-9]+)[.]([0-9]+)[.]([0-9]+)$")
          ACCEPTANCE_RUN_URL = re.compile(r"^https://github[.]com/([^/]+/[^/]+)/actions/runs/([0-9]+)(?:[/?#].*)?$")


          def _json_file(repo, path, sha, api):
              raw = api(f"repos/{repo}/contents/{path}?ref={sha}")
              encoded = raw.get("content") if isinstance(raw, dict) else None
              if not encoded:
                  raise RuntimeError(f"missing {path} at candidate SHA")
              try:
                  return json.loads(base64.b64decode(encoded).decode("utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  raise RuntimeError(f"invalid JSON in {path}: {exc}") from exc


          def _marker(body, name):
              m = re.search(rf"(?im)^\s*{re.escape(name)}:\s*(\S.+?)\s*$", body or "")
              return m.group(1).strip() if m else None


          def acceptance_reasons(repo, sha, api=None):
              """ACC-3: release-readiness from versioned scope + live GitHub Issue/Actions evidence."""
              api = api or gh_api
              manifest = _json_file(repo, "kavosh.project.json", sha, api)
              if manifest.get("acceptance", {}).get("mode", "none") != "continuous":
                  return []
              scope = _json_file(repo, "acceptance/scope.json", sha, api)
              reasons = []
              if scope.get("schemaVersion") != 1:
                  reasons.append("acceptance scope schemaVersion must be 1")
              target = scope.get("targetRelease")
              tm = ACCEPTANCE_RELEASE_RE.fullmatch(target or "")
              if not tm:
                  reasons.append("acceptance targetRelease must match vX.Y.Z")
              items = scope.get("items")
              if not isinstance(items, list) or not items:
                  return reasons + ["continuous acceptance scope must contain at least one item"]
              target_tuple = tuple(map(int, tm.groups())) if tm else None
              seen = set()
              marker_for = {
                  "test": "Acceptance-Test-Evidence",
                  "ui": "Acceptance-UI-Evidence",
                  "security": "Acceptance-Security-Evidence",
                  "migration": "Acceptance-Migration-Evidence",
              }
              for item in items:
                  if not isinstance(item, dict):
                      reasons.append("acceptance scope contains a non-object item")
                      continue
                  aid = item.get("id") or "<missing-id>"
                  if aid in seen:
                      reasons.append(f"{aid}: duplicate acceptance ID")
                      continue
                  seen.add(aid)
                  owner = item.get("owner")
                  issue_no = item.get("issue")
                  risk = item.get("risk")
                  evidence = item.get("evidence") if isinstance(item.get("evidence"), list) else []
                  if not isinstance(owner, str) or not owner:
                      reasons.append(f"{aid}: invalid owner")
                      continue
                  if risk not in ("low", "medium", "high", "critical"):
                      reasons.append(f"{aid}: invalid risk")
                      continue
                  if not evidence or "ci" not in evidence:
                      reasons.append(f"{aid}: evidence must include ci")
                      continue
                  if risk in ("high", "critical") and "test" not in evidence:
                      reasons.append(f"{aid}: high/critical risk requires test evidence")
                      continue
                  deferred = item.get("deferredTo")
                  if deferred:
                      dm = ACCEPTANCE_RELEASE_RE.fullmatch(deferred) if isinstance(deferred, str) else None
                      defer_issue = item.get("deferIssue")
                      if not dm or not target_tuple or tuple(map(int, dm.groups())) <= target_tuple:
                          reasons.append(f"{aid}: invalid deferredTo")
                          continue
                      if not isinstance(defer_issue, int) or defer_issue <= 0:
                          reasons.append(f"{aid}: deferIssue required")
                          continue
                      issue = api(f"repos/{repo}/issues/{defer_issue}")
                      if issue.get("state") != "closed":
                          reasons.append(f"{aid}: defer approval issue #{defer_issue} is not closed")
                          continue
                      approved = _marker(issue.get("body") or "", "Defer-Approved-By")
                      if approved != f"@{owner}":
                          reasons.append(f"{aid}: defer is not approved by @{owner}")
                      continue

                  if not isinstance(issue_no, int) or issue_no <= 0:
                      reasons.append(f"{aid}: invalid canonical issue")
                      continue
                  issue = api(f"repos/{repo}/issues/{issue_no}")
                  body = issue.get("body") or ""
                  if issue.get("state") != "closed":
                      reasons.append(f"{aid}: acceptance issue #{issue_no} is not closed")
                      continue
                  accepted_by = _marker(body, "Accepted-By")
                  if accepted_by != f"@{owner}":
                      reasons.append(f"{aid}: missing Accepted-By: @{owner}")
                  merged_sha = _marker(body, "Acceptance-Merged-SHA")
                  if not merged_sha or not ACCEPTANCE_SHA_RE.fullmatch(merged_sha):
                      reasons.append(f"{aid}: missing valid Acceptance-Merged-SHA")
                  else:
                      cmp = api(f"repos/{repo}/compare/{merged_sha}...{sha}")
                      if cmp.get("status") not in ("ahead", "identical"):
                          reasons.append(f"{aid}: merged SHA is not an ancestor of candidate")
                  run_url = _marker(body, "Acceptance-Evidence-Run")
                  rm = ACCEPTANCE_RUN_URL.fullmatch(run_url or "")
                  if not rm or rm.group(1).lower() != repo.lower():
                      reasons.append(f"{aid}: missing same-repository Actions Acceptance-Evidence-Run")
                  else:
                      run = api(f"repos/{repo}/actions/runs/{rm.group(2)}")
                      if run.get("status") != "completed" or run.get("conclusion") != "success":
                          reasons.append(f"{aid}: referenced Actions evidence run is not successful")
                  for ev in evidence:
                      marker = marker_for.get(ev)
                      if marker and not re.match(r"^https://\S+$", _marker(body, marker) or ""):
                          reasons.append(f"{aid}: missing {marker}")
              return reasons


          def gate(repo, sha, required, branch="main", wait=300, interval=15, api=None, sleep=time.sleep):
              api = api or gh_api
              required = list(dict.fromkeys(required or []))
              if not set(DEFAULT_REQUIRED).issubset(required):
                  return False, [f"required checks must include {', '.join(DEFAULT_REQUIRED)}"]
              head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
              if head != sha:
                  return None, [f"{sha[:7]} is not the current head of {branch} ({(head or '?')[:7]}); the next run will handle the newer commit"]
              deadline = time.monotonic() + wait
              while True:
                  ok, pending, reasons = evaluate(check_runs(repo, sha, api), required)
                  if ok or not pending or time.monotonic() >= deadline:
                      final_head = api(f"repos/{repo}/branches/{branch}").get("commit", {}).get("sha")
                      if final_head != sha:
                          return None, [f"{sha[:7]} stopped being the current head of {branch} during validation"]
                      return ok, reasons
                  sleep(interval)


          def main(argv=None):
              p = argparse.ArgumentParser(description=__doc__.splitlines()[0])
              p.add_argument("--repo", required=True)
              p.add_argument("--sha", required=True)
              p.add_argument("--branch", default="main")
              p.add_argument("--required", default=",".join(DEFAULT_REQUIRED))
              p.add_argument("--wait", type=int, default=300, help="seconds to wait for pending required checks")
              a = p.parse_args(argv)
              required = [x.strip() for x in a.required.split(",") if x.strip()]
              if not required:
                  print("REL-5: no required checks configured — refusing to open the gate")
                  return 1
              try:
                  ok, reasons = gate(a.repo, a.sha, required, a.branch, a.wait)
              except RuntimeError as e:
                  print(f"REL-5 gate CLOSED: cannot read checks ({e}) — unavailable CI is not permission to release")
                  return 1
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"open={'true' if ok else 'false'}\n")
              if ok is None:
                  print(f"REL-5: {reasons[0]} — skipping")
                  return 0
              if ok:
                  try:
                      acceptance = acceptance_reasons(a.repo, a.sha)
                  except RuntimeError as e:
                      print(f"ACC-3 gate CLOSED: cannot read acceptance evidence ({e})")
                      return 1
                  if acceptance:
                      print(f"ACC-3 gate CLOSED for {a.sha[:7]}:")
                      for reason in acceptance:
                          print(f"  - {reason}")
                      return 1
                  print(f"REL-5/ACC-3 gate OPEN for {a.sha[:7]}: required checks and acceptance readiness succeeded")
                  return 0
              print(f"REL-5 gate CLOSED for {a.sha[:7]}:")
              for r in reasons:
                  print(f"  - {r}")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY
      - name: release-please
        id: rp
        if: steps.gate.outputs.open == 'true'
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: package
    needs: release
    if: inputs.package && needs.release.outputs.created == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') != ''
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != '' && hashFiles('.node-version') == ''
        with:
          node-version: "lts/*"
      - run: make setup
      - run: make package
      - name: Attach dist/* to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ls dist/* >/dev/null 2>&1 || { echo "make package produced no files in dist/"; exit 1; }
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
